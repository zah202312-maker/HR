name: hr_app
description: HR — Human Resources Management System (Flutter, mobile and web).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_web_auth_2: ^4.1.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  file_picker: ^8.1.4
  web: ^1.1.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  audioplayers: ^6.8.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

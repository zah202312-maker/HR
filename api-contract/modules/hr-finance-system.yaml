                startDate: '2025-12-01'
                endDate: '2026-11-30'
                previousContractId: null
                status: renewed
                daysRemaining: 26
                isExpired: false
                recommendation:
                  employeePosition: "أداء جيد والتزام منتظم بالدوام"
                  recommendation: renew
                  note: null
                  recommendedBy:
                    id: a13c5e70-2b84-4d19-8f60-3e7a1c9d5b42
                    displayName: "سارة خالد"
                  recommendedAt: '2026-11-04T07:30:00Z'
                decision:
                  decision: renew
                  note: null
                  employeeMessage: "تمت الموافقة على تجديد عقدك."
                  decidedBy:
                    id: a13c5e70-2b84-4d19-8f60-3e7a1c9d5b42
                    displayName: "سارة خالد"
                  decidedAt: '2026-11-05T10:00:00Z'

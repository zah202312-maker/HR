        العقود التي لم يصدر فيها قرار وينتهي endDate خلال المدة، بما فيها المنتهية دون قرار. الترتيب الافتراضي endDate تصاعديًا.
        مهمة يومية تنقل العقد إلى pendingRecommendation عند دخوله مدة التنبيه، وترسل contractExpiring إلى مدير الموارد البشرية مرة واحدة. تغيير alertDays يطبق من التشغيل اليومي التالي.
      x-source: ["5.13", "10"]
      x-release: 3
      x-allowed-roles: [hrManager]
      x-permission: Hr.Contract.Read
      x-data-scope: company
      x-error-codes: []
      parameters:

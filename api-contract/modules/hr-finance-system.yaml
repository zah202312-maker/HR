        - تتطلب الحالة pendingRecommendation، وتنقلها إلى pendingDecision.
        - تضبط decisionDueDate على 5 أيام دوام من يوم الرفع، من تقويم الشركة.
        - لا يصل شيء منها إلى الموظف.
      x-source: ["5.13", "10"]
      x-release: 3

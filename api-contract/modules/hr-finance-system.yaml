components:
  securitySchemes:
    oauth2:
      $ref: './common.yaml#/components/securitySchemes/oauth2'
  parameters:
    EmployeeIdPath:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentIdPath:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CodePath:
      name: code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FinanceReportCode'
  schemas:
    ContractStatus:
      type: string
      description: "active: ساري وخارج فترة التنبيه. pendingRecommendation: داخل فترة التنبيه وبانتظار توصية الموارد البشرية. pendingDecision: رُفعت التوصية وبانتظار القرار. renewed وnotRenewed: حالتان نهائيتان بعد القرار."
      enum: [active, pendingRecommendation, pendingDecision, renewed, notRenewed]
    ContractEmployeeStatus:
      type: string
      description: "الحالة التي يراها الموظف. مراحل التوصية الداخلية تظهر له active."
      enum: [active, renewed, notRenewed]
    ContractRenewalOption:
      type: string
      enum: [renew, doNotRenew]
    ContractCreateInputDto:
      type: object
      required: [employeeId, contractType, startDate, endDate]
      properties:
        employeeId:
          type: string
          format: uuid
        contractType:
          type: string
          minLength: 1
          maxLength: 100
          description: "نوع العقد كما تدخله الموارد البشرية."
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: "يجب أن يكون بعد startDate."
        previousContractId:
          type: string
          format: uuid
          description: "العقد السابق عند إنشاء عقد التجديد. يجب أن تكون حالته renewed ولنفس الموظف."
          nullable: true
    ContractRecommendationDto:
      type: object
      required: [employeePosition, recommendation, note, recommendedBy, recommendedAt]
      properties:
        employeePosition:
          type: string
          description: "موقف الموظف الذي ترفعه الموارد البشرية."
        recommendation:
          $ref: '#/components/schemas/ContractRenewalOption'
        note:
          type: string
          nullable: true
        recommendedBy:
          $ref: './common.yaml#/components/schemas/UserRefDto'
        recommendedAt:
          type: string
          format: date-time
    ContractDecisionDto:
      type: object
      required: [decision, note, employeeMessage, decidedBy, decidedAt]
      properties:
        decision:
          $ref: '#/components/schemas/ContractRenewalOption'
        note:
          type: string
          description: "ملاحظة داخلية لا تصل إلى الموظف."
          nullable: true
        employeeMessage:
          type: string
          description: "النص الذي يراه الموظف."
          nullable: true
        decidedBy:
          $ref: './common.yaml#/components/schemas/UserRefDto'
        decidedAt:
          type: string
          format: date-time
    ContractDto:
      type: object
      description: "عرض الموارد البشرية للعقد. لا يتضمن أي بيانات مالية."
      required:
        - id
        - employee
        - contractType
        - startDate
        - endDate
        - previousContractId
        - status
        - daysRemaining
        - isExpired
        - recommendation
        - decision
        - decisionDueDate
        - isDecisionOverdue
        - employeeNotifiedAt
        - creationTime
        - lastModificationTime
      properties:
        id:
          type: string
          format: uuid
        employee:
          $ref: './common.yaml#/components/schemas/EmployeeRefDto'
        contractType:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        previousContractId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/ContractStatus'
        daysRemaining:
          type: integer
          format: int32
          description: "الأيام التقويمية حتى endDate. تكون سالبة بعد انتهاء العقد."
        isExpired:
          type: boolean
          description: "true إذا مضى endDate."
        recommendation:
          type: object
          allOf:
            - $ref: '#/components/schemas/ContractRecommendationDto'
          nullable: true
        decision:
          type: object
          allOf:
            - $ref: '#/components/schemas/ContractDecisionDto'
          nullable: true
        decisionDueDate:
          type: string
          format: date
          description: "موعد القرار: 5 أيام دوام من رفع التوصية."
          nullable: true
        isDecisionOverdue:
          type: boolean
          description: "true إذا مضى decisionDueDate دون قرار. لا يترتب عليه إجراء تلقائي."
        employeeNotifiedAt:
          type: string
          format: date-time
          description: "وقت إبلاغ الموظف بالقرار."
          nullable: true
        creationTime:
          type: string
          format: date-time
        lastModificationTime:
          type: string
          format: date-time
          nullable: true
    ContractPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractDto'
    ContractExpiringPagedResultDto:
      type: object
      required: [totalCount, items, alertDays]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractDto'
        alertDays:
          type: integer
          format: int32
          description: "القيمة الفعلية لمدة التنبيه المستخدمة في هذه النتيجة."
    ContractRecommendInputDto:
      type: object
      required: [employeePosition, recommendation]
      properties:
        employeePosition:
          type: string
          minLength: 1
          maxLength: 2000
        recommendation:
          $ref: '#/components/schemas/ContractRenewalOption'
        note:
          type: string
          maxLength: 2000
          nullable: true
    ContractDecideInputDto:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/ContractRenewalOption'
        note:
          type: string
          maxLength: 2000
          description: "ملاحظة داخلية لا تصل إلى الموظف."
          nullable: true
        employeeMessage:
          type: string
          maxLength: 2000
          description: "نص اختياري يظهر للموظف."
          nullable: true
    ContractEmployeeDto:
      type: object
      description: "عرض الموظف لعقده. لا يتضمن الموقف أو التوصية أو الملاحظة الداخلية أو هوية المعتمد."
      required: [id, contractType, startDate, endDate, status, isExpired, employeeMessage, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        contractType:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ContractEmployeeStatus'
        isExpired:
          type: boolean
        employeeMessage:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
    ContractEmployeePagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractEmployeeDto'
    WarningLevel:
      type: string
      enum: [first, final]
    WarningStatus:
      type: string
      description: "recommended: توصية مسجلة لم يُبلغ بها الموظف، ولا تعد إنذارًا. notified: أُبلغ الموظف ومهلة الرد مفتوحة. responded: رد الموظف. responseExpired: انتهت المهلة دون رد. issued: صدر الإنذار بقرار الموارد البشرية. dismissed: قررت الموارد البشرية عدم الإصدار. objected: اعترض الموظف. objectionUpheld: أيد المدير التنفيذي الإنذار. objectionOverturned: ألغى المدير التنفيذي الإنذار."
      enum:
        - recommended
        - notified
        - responded
        - responseExpired
        - issued
        - dismissed
        - objected
        - objectionUpheld
        - objectionOverturned
    WarningRecommenderRole:
      type: string
      enum: [departmentManager, reviewer]
    WarningDecisionOutcome:
      type: string
      enum: [issue, dismiss]
    WarningObjectionOutcome:
      type: string
      enum: [uphold, overturn]
    WarningRecommendationStage:
      type: string
      description: "المرحلة التي يراها صاحب التوصية، دون كشف الرد أو الاعتراض."
      enum: [underReview, issued, notIssued]
    WarningCreateInputDto:
      type: object
      required: [employeeId, recommendedLevel, incidentDate, description]
      properties:
        employeeId:
          type: string
          format: uuid
        recommendedLevel:
          $ref: '#/components/schemas/WarningLevel'

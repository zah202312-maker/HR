openapi: '3.0.3'
info:
  title: HR System - Contracts, Warnings, Appreciation, Finance, Notifications, Settings, Audit
  version: '1.0.0'
  description: |-
    العقود والإنذارات وكتب الشكر والمحاسبة والإشعارات والإعدادات وسجل التدقيق.

    قواعد مشتركة في هذه الوحدة:
    - x-release: القيمة 1 لما يسبق الإطلاق التجريبي (المراحل 0 إلى 3 في القسم 12)، و2 للمرحلة 4، و3 للمرحلة 5.
    - x-data-scope-by-role: يظهر عندما يختلف النطاق بين الأدوار، وتكون x-data-scope أوسع نطاق.
    - الأدوار: كل من له سجل موظف يحمل دور employee مع أدواره الأخرى، وتكون صلاحياته مجموع أدواره. لذلك تعلن العمليات الذاتية الدور employee فقط، وتقتصر على بيانات المستخدم نفسه.
    - أيام الدوام في المهل تحسب من تقويم الشركة عبر WorkCalendarService، بدءًا من يوم الدوام التالي للحدث.
    - البيانات المالية: لا يوجد DTO مالي لمدير القسم أو مسؤول المخزن، وكل اطلاع عليها يُسجل.
    - لا يوجد حذف للحركات المالية أو الإنذارات. التصحيح يتم بحركة عكسية أو قرار موثق.
    - كل {id} و{employeeId} و{attachmentId} مقيد بصيغة GUID في توجيه الخادم، فلا يتعارض مع المقاطع الثابتة مثل my وemployee وexpiring.
tags:
  - name: Contracts
    description: "العقود (5.13)"
  - name: Warnings
    description: "الإنذارات (5.14)"
  - name: AppreciationLetters
    description: "كتب الشكر (5.15)"
  - name: Finance
    description: "المحاسبة المبسطة (5.16)"
  - name: Notifications
    description: "الإشعارات (5.17)"
  - name: SystemSettings
    description: "الإعدادات (5.18)"
  - name: AuditLog
    description: "سجل التدقيق"
security:
  - oauth2: [HR_Mangment2]
paths:
  /api/app/contract:
    get:
      operationId: Contract_List
      tags: [Contracts]
      summary: List contracts
      description: "قائمة عقود الشركة لمدير الموارد البشرية. مدير القسم ليس طرفًا في مسار العقود ولا يملك هذه العملية."

    NotificationTemplateCode:
      type: string
      description: |-
        رمز القالب الذي يحدد وجهة التطبيق. عند ظهور رمز غير معروف يفتح التطبيق قائمة الإشعارات.

        | templateCode | resourceType | المستلم | وجهة التطبيق |
        |---|---|---|---|
        | requestPendingAction | request | المعتمد الحالي، ومنه المحاسب في خطوته | تفاصيل الطلب: GET /api/app/request/{resourceId} |
        | requestStatusChanged | request | صاحب الطلب | تفاصيل الطلب: GET /api/app/request/{resourceId} |
        | requestSubmittedOnBehalf | request | الموظف الذي رُفع الطلب نيابة عنه | تفاصيل الطلب: GET /api/app/request/{resourceId} |
        | requestApprovalReminder | request | المعتمد الحالي (تذكير دوري دون إجراء تلقائي) | تفاصيل الطلب: GET /api/app/request/{resourceId} |
        | memoUpdate | memo | كاتب المطالعة أو مستلمها | شاشة المطالعة في وحدة الطلبات |
        | incidentUpdate | incident | مقدم البلاغ أو مستلمه | شاشة البلاغ في وحدة الطلبات |
        | stockIssuePending | stockIssue | مسؤول المخزن | شاشة طلب الصرف في وحدة المخزن |
        | custodyAssigned | custody | مستلم العهدة | شاشة «عهدتي» لتأكيد الاستلام |
        | circularReceived | circular | مستلم التعميم | شاشة التعميم لتأكيد الاستلام |
        | monthEndCycleOpened | evaluationCycle | مدير القسم؛ تنبيه واحد يجمع التقييم والتقرير، والعدد في count | شاشة الدورة الشهرية |
        | monthlyCycleReminder | evaluationCycle | مدير القسم؛ تذكير يومي، والمتبقي في count | شاشة الدورة الشهرية |
        | monthlyCycleEscalated | evaluationCycle | مدير الموارد البشرية | شاشة متابعة إنجاز الأقسام |
        | evaluationPublished | evaluation | الموظف المُقيَّم | شاشة «تقييمي»: GET /api/app/evaluation/{resourceId} |
        | evaluationResponseReceived | evaluation | مدير الموارد البشرية | GET /api/app/evaluation/{resourceId} |
        | evaluationObjectionDecided | evaluation | الموظف المُقيَّم | شاشة «تقييمي»: GET /api/app/evaluation/{resourceId} |
        | complaintUpdate | complaint | مقدم الشكوى أو معالجها؛ رمز واحد لكل الحالات والمستويات، ونصه دائمًا «لديك تحديث جديد» | GET /api/app/complaint/{resourceId}، ويرد 404 لغير المخول |
        | contractExpiring | contract | مدير الموارد البشرية | GET /api/app/contract/{resourceId} |
        | contractDecisionDue | contract | مدير الموارد البشرية | GET /api/app/contract/{resourceId} |
        | contractDecided | contract | صاحب العقد | GET /api/app/contract/my/{resourceId} |
        | warningRecommended | warning | مدير الموارد البشرية | GET /api/app/warning/{resourceId} |
        | warningNotified | warning | الموظف المعني | GET /api/app/warning/my/{resourceId} |
        | warningReadyForDecision | warning | مدير الموارد البشرية بعد رد الموظف أو انتهاء مهلته | GET /api/app/warning/{resourceId} |
        | warningDecided | warning | الموظف المعني | GET /api/app/warning/my/{resourceId} |
        | warningObjectionSubmitted | warning | المدير التنفيذي | GET /api/app/warning/{resourceId} |
        | warningObjectionResolved | warning | الموظف المعني | GET /api/app/warning/my/{resourceId} |
        | warningObjectionResolvedForHr | warning | مدير الموارد البشرية | GET /api/app/warning/{resourceId} |
        | appreciationLetterIssued | appreciationLetter | الموظف المعني | GET /api/app/appreciation-letter/{resourceId} |
        | payrollRunPendingApproval | payrollRun | المعتمد المحدد في الإعدادات | GET /api/app/finance/payroll-run/{resourceId} |
        | payrollRunApproved | payrollRun | المحاسب | GET /api/app/finance/payroll-run/{resourceId} |
        | payslipAvailable | payslip | الموظف بعد إغلاق الكشف | GET /api/app/finance/payslip/my/{resourceId} |
        | adjustmentSuggestionsReady | adjustmentSuggestion | المحاسب؛ resourceId فارغ والعدد في count | GET /api/app/finance/adjustment/suggestions |
        | accountPasswordReset | none | صاحب الحساب | شاشة الإشعارات فقط، دون انتقال |
      enum:
        - requestPendingAction
        - requestStatusChanged
        - requestSubmittedOnBehalf
        - requestApprovalReminder
        - memoUpdate
        - incidentUpdate
        - stockIssuePending
        - custodyAssigned
        - circularReceived
        - monthEndCycleOpened
        - monthlyCycleReminder
        - monthlyCycleEscalated
        - evaluationPublished
        - evaluationResponseReceived
        - evaluationObjectionDecided
        - complaintUpdate
        - contractExpiring
        - contractDecisionDue
        - contractDecided
        - warningRecommended
        - warningNotified
        - warningReadyForDecision
        - warningDecided
        - warningObjectionSubmitted
        - warningObjectionResolved
        - warningObjectionResolvedForHr
        - appreciationLetterIssued
        - payrollRunPendingApproval
        - payrollRunApproved
        - payslipAvailable
        - adjustmentSuggestionsReady
        - accountPasswordReset

  /api/app/contract/{id}/decide:
    post:
      operationId: Contract_Decide
      tags: [Contracts]
      summary: Decide contract renewal
      description: |-
        الخطوة الثانية الموثقة، وينفذها مدير الموارد البشرية حاليًا. القرار مطلوب خلال 5 أيام دوام، ولا يمنع التأخر إصداره.
        - تتطلب الحالة pendingDecision، وتنقلها إلى renewed أو notRenewed.
        - القرار قد يخالف التوصية، ويبقى كلاهما محفوظًا.
        - إبلاغ الموظف تلقائي وفوري بإشعار contractDecided عبر القنوات المفعلة، وليس عملية منفصلة، ويُسجل وقته في employeeNotifiedAt.
      x-source: ["5.13", "10"]
      x-release: 3
      x-allowed-roles: [hrManager]
      x-permission: Hr.Contract.Decide
      x-data-scope: company
      x-error-codes: ["Hr:Contract:InvalidStatus", "Hr:Contract:SelfActionNotAllowed"]
      x-open-question: "ما أثر تجاوز مهلة الأيام الخمسة؟ وهل ينشئ قرار التجديد العقد الجديد تلقائيًا؟ العقد يكتفي بعلامة التأخر وتذكير contractDecisionDue، ويتطلب إنشاء العقد الجديد عبر Contract_Create."
      parameters:
        - $ref: './common.yaml#/components/parameters/AcceptLanguage'
        - $ref: './common.yaml#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractDecideInputDto'
            example:
              decision: renew
              note: null
              employeeMessage: "تمت الموافقة على تجديد عقدك."
      responses:

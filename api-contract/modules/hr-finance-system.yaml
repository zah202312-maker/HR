      x-release: 3
      x-allowed-roles: [hrManager]
      x-permission: Hr.Contract.Read
      x-data-scope: company
      x-error-codes: []
      parameters:
        - $ref: './common.yaml#/components/parameters/AcceptLanguage'
        - $ref: './common.yaml#/components/parameters/SkipCount'
        - $ref: './common.yaml#/components/parameters/MaxResultCount'
        - $ref: './common.yaml#/components/parameters/Sorting'
        - name: employeeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ContractStatus'
        - name: endDateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDateTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPagedResultDto'
              example:
                totalCount: 1
                items:
                  - id: c0a1b2d3-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    employee:
                      id: '4f2a8c11-6d3e-4b70-9a15-1c7e0d9b3a21'
                      fullName: "أحمد سالم"
                      departmentName: "تقنية المعلومات"
                    contractType: "محدد المدة"
                    startDate: '2025-12-01'
                    endDate: '2026-11-30'
                    previousContractId: null
                    status: pendingDecision
                    daysRemaining: 26
                    isExpired: false
                    recommendation:
                      employeePosition: "أداء جيد والتزام منتظم بالدوام"
                      recommendation: renew
                      note: null
                      recommendedBy:
                        id: a13c5e70-2b84-4d19-8f60-3e7a1c9d5b42
                        displayName: "سارة خالد"
                      recommendedAt: '2026-11-04T07:30:00Z'
                    decision: null
                    decisionDueDate: '2026-11-11'
                    isDecisionOverdue: false
                    employeeNotifiedAt: null
                    creationTime: '2025-11-20T08:00:00Z'
                    lastModificationTime: '2026-11-04T07:30:00Z'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
    post:
      operationId: Contract_Create
      tags: [Contracts]
      summary: Create a contract
      description: |-
        ينشئ عقدًا لموظف، ويشمل ذلك مديري الأقسام بوصفهم موظفين.
        - الحالة الأولية active، أو pendingRecommendation إذا كان endDate داخل مدة التنبيه.
        - عقد التجديد يُنشأ بهذه العملية مع previousContractId.
        - لا يُرسل إشعار إلى الموظف عند الإنشاء.
      x-source: ["5.13", "10"]
      x-release: 3
      x-allowed-roles: [hrManager]
      x-permission: Hr.Contract.Create
      x-data-scope: company
      x-error-codes:
        - 'Hr:Contract:EmployeeNotFound'
        - 'Hr:Contract:InvalidDateRange'
        - 'Hr:Contract:OverlappingContract'
        - 'Hr:Contract:InvalidPreviousContract'
      parameters:
        - $ref: './common.yaml#/components/parameters/AcceptLanguage'
        - $ref: './common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreateInputDto'
            example:
              employeeId: '4f2a8c11-6d3e-4b70-9a15-1c7e0d9b3a21'
              contractType: "محدد المدة"
              startDate: '2026-12-01'
              endDate: '2027-11-30'
              previousContractId: c0a1b2d3-4e5f-4a6b-8c7d-9e0f1a2b3c4d
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDto'
              example:
                id: c0a1b2d3-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                employee:
                  id: '4f2a8c11-6d3e-4b70-9a15-1c7e0d9b3a21'
                  fullName: "أحمد سالم"
                  departmentName: "تقنية المعلومات"
                contractType: "محدد المدة"
                startDate: '2026-12-01'
                endDate: '2027-11-30'
                previousContractId: c0a1b2d3-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                status: active
                daysRemaining: 391
                isExpired: false
                recommendation: null
                decision: null
                decisionDueDate: null
                isDecisionOverdue: false
                employeeNotifiedAt: null
                creationTime: '2025-11-20T08:00:00Z'
                lastModificationTime: '2026-11-04T07:30:00Z'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '422':
          $ref: './common.yaml#/components/responses/BusinessRuleViolation'

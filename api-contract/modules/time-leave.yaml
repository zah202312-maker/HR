components:
  securitySchemes:
    oauth2:
      $ref: "./common.yaml#/components/securitySchemes/oauth2"
    deviceKey:
      $ref: "./common.yaml#/components/securitySchemes/deviceKey"
  schemas:
    WorkShiftType:
      type: string
      description: "fixed = ثابت، rotating = متناوب، overnight = ليلي يمتد بعد منتصف الليل."
      enum: [fixed, rotating, overnight]
    WorkShiftOvertimePolicy:
      type: string
      description: "none = لا يُحتسب عمل إضافي. afterShiftEnd = كل ما بعد نهاية الوردية المجدولة. afterDailyHours = ما يتجاوز overtimeAfterHours من ساعات العمل الفعلية في اليوم."
      enum: [none, afterShiftEnd, afterDailyHours]
    WorkShiftDayOfWeek:
      type: string
      enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
    WorkShiftDayDto:
      type: object
      description: "يوم عمل واحد في القالب. الأيام غير المدرجة أيام راحة أسبوعية للموظف ولا تُحسب من الإجازة."
      required: [startTime, endTime, crossesMidnight]
      properties:
        dayOfWeek:
          description: "إلزامي للقالب fixed وovernight، ويجب أن يكون null للقالب rotating. يوم الوردية هو اليوم الذي تبدأ فيه."
          allOf:
            - $ref: "#/components/schemas/WorkShiftDayOfWeek"
          nullable: true
        cycleDayNumber:
          type: integer
          format: int32
          description: "رقم اليوم داخل دورة التناوب من 1 إلى rotationCycleDays. إلزامي للقالب rotating، ويجب أن يكون null لغيره. اليوم غير المدرج في الدورة يوم راحة."
          nullable: true
          minimum: 1
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: "وقت البداية بتوقيت الشركة."
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: "وقت النهاية بتوقيت الشركة."
        crossesMidnight:
          type: boolean
          description: "true إذا كان endTime في اليوم التالي. يجب أن يساوي (endTime <= startTime)، وإلا يُرفض بـHr:Shift:CrossesMidnightMismatch."
    WorkShiftCreateDto:
      type: object
      required: [nameAr, nameEn, type, graceMinutes, overtimePolicy, days]
      properties:
        nameAr:
          type: string
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: "#/components/schemas/WorkShiftType"
        graceMinutes:
          type: integer
          format: int32
          description: "دقائق السماح بالتأخير. لا يُحسب التأخر إلا بعد تجاوزها، وعندها يُحسب من بداية الوردية."
          minimum: 0
          maximum: 240
        overtimePolicy:
          $ref: "#/components/schemas/WorkShiftOvertimePolicy"
        overtimeAfterHours:
          type: number
          format: decimal
          description: "إلزامي عندما overtimePolicy = afterDailyHours، ويجب أن يكون null لغيرها."
          nullable: true
          minimum: 0
        rotationCycleDays:
          type: integer
          format: int32
          description: "طول دورة التناوب بالأيام. إلزامي للقالب rotating، ويجب أن يكون null لغيره. اليوم 1 من الدورة هو تاريخ بداية ربط الموظف بالقالب."
          nullable: true
          minimum: 2
          maximum: 366
        days:
          type: array
          description: "أيام القالب. لا يتكرر اليوم نفسه."
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkShiftDayDto"
    WorkShiftUpdateDto:
      type: object
      required: [nameAr, nameEn, type, graceMinutes, overtimePolicy, days, isActive, concurrencyStamp]
      properties:
        nameAr:
          type: string
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          minLength: 1
          maxLength: 128
        type:
          $ref: "#/components/schemas/WorkShiftType"
        graceMinutes:
          type: integer
          format: int32
          description: "دقائق السماح بالتأخير. لا يُحسب التأخر إلا بعد تجاوزها، وعندها يُحسب من بداية الوردية."
          minimum: 0
          maximum: 240
        overtimePolicy:
          $ref: "#/components/schemas/WorkShiftOvertimePolicy"
        overtimeAfterHours:
          type: number
          format: decimal
          description: "إلزامي عندما overtimePolicy = afterDailyHours، ويجب أن يكون null لغيرها."
          nullable: true
          minimum: 0
        rotationCycleDays:
          type: integer
          format: int32
          description: "طول دورة التناوب بالأيام. إلزامي للقالب rotating، ويجب أن يكون null لغيره. اليوم 1 من الدورة هو تاريخ بداية ربط الموظف بالقالب."
          nullable: true
          minimum: 2
          maximum: 366
        days:
          type: array
          description: "أيام القالب. لا يتكرر اليوم نفسه."
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkShiftDayDto"
        isActive:
          type: boolean
          description: "القالب غير المفعل لا يُربط به موظف جديد، ويبقى ساريًا لمن رُبط به سابقًا."
        concurrencyStamp:
          type: string
    WorkShiftDto:
      type: object
      required: [id, name, nameAr, nameEn, type, graceMinutes, overtimePolicy, days, isActive, assignedEmployeeCount, creationTime, concurrencyStamp]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: "Localized by Accept-Language."
        nameAr:
          type: string
        nameEn:
          type: string
        type:
          $ref: "#/components/schemas/WorkShiftType"
        graceMinutes:
          type: integer
          format: int32
        overtimePolicy:
          $ref: "#/components/schemas/WorkShiftOvertimePolicy"
        overtimeAfterHours:
          type: number
          format: decimal
          nullable: true
        rotationCycleDays:
          type: integer
          format: int32
          nullable: true
        days:
          type: array
          items:
            $ref: "#/components/schemas/WorkShiftDayDto"
        isActive:
          type: boolean
        assignedEmployeeCount:
          type: integer
          format: int32
          description: "عدد الموظفين المرتبطين بالقالب حاليًا."
        creationTime:
          type: string
          format: date-time
        lastModificationTime:
          type: string
          format: date-time
          nullable: true
        concurrencyStamp:
          type: string
    WorkShiftRefDto:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: "Localized by Accept-Language."
        type:
          $ref: "#/components/schemas/WorkShiftType"
    WorkShiftPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
          description: "Total matching records before paging."
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkShiftDto"
    EmployeeShiftAssignDto:
      type: object
      required: [shiftId, startDate]
      properties:
        shiftId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          description: "تاريخ بداية الدوام الجديد. لا يسبق تاريخ مباشرة الموظف، ولا بداية آخر ربط له."
    EmployeeShiftDto:
      type: object
      required: [id, employee, shift, startDate, creationTime]
      properties:
        id:
          type: string
          format: uuid
        employee:
          $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
        shift:
          $ref: "#/components/schemas/WorkShiftRefDto"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: "آخر يوم في هذا الربط. null يعني أنه الربط الساري."
          nullable: true
        creationTime:
          type: string
          format: date-time
        createdBy:
          allOf:
            - $ref: "./common.yaml#/components/schemas/UserRefDto"
          nullable: true
    EmployeeShiftPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
          description: "Total matching records before paging."
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeShiftDto"
    HolidayWriteDto:
      type: object
      required: [date, nameAr, nameEn]
      properties:
        date:
          type: string
          format: date
          description: "العطلة ليوم واحد. العطلة الممتدة تُدخل بسجل لكل يوم."
        nameAr:
          type: string
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          minLength: 1
          maxLength: 128
    HolidayUpdateDto:
      type: object
      required: [date, nameAr, nameEn, concurrencyStamp]
      properties:
        date:
          type: string
          format: date
        nameAr:
          type: string
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          minLength: 1
          maxLength: 128
        concurrencyStamp:
          type: string
    HolidayDto:
      type: object
      required: [id, date, name, nameAr, nameEn, concurrencyStamp]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        name:
          type: string
          description: "Localized by Accept-Language."
        nameAr:
          type: string
        nameEn:
          type: string
        concurrencyStamp:
          type: string
    HolidayPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
          description: "Total matching records before paging."
        items:
          type: array
          items:
            $ref: "#/components/schemas/HolidayDto"
    WeeklyOffSettingDto:
      type: object
      required: [days, concurrencyStamp]
      properties:
        days:
          type: array
          description: "أيام العطلة الأسبوعية في تقويم الشركة."
          items:

openapi: "3.0.3"
info:
  title: "HR System - Time and Leave"
  version: "1.0.0"
  description: "الدوام والعطل والحضور وتصحيح البصمة والإجازات. المرجع: الأقسام 5.2 و5.3 و5.4 و10 من وثيقة المتطلبات. الأدوار: المراجع والمحاسب ومسؤول المخزن يقدمون الإجازة ويرون حضورهم بدور employee الذي يحملونه مع دورهم، فالصلاحيات مجموع الأدوار. قواعد الإجازة الملزمة: (1) سنة كل موظف تبدأ من يوم مباشرته، ومن باشر في 29 فبراير تبدأ سنته في 28 فبراير إذا لم تكن السنة كبيسة. (2) مدير الموارد البشرية يحدد عدد الأيام يدويًا، والتغيير يبدأ من السنة القادمة، والتعديل الحالي يدوي مع السبب. (3) عند انتهاء السنة يرحل Worker يومي، بأمان عند التكرار، كل المتبقي دون حد أقصى باسم «الإجازات المضافة من السنة الماضية». مثال: باشر في 2026-03-15 برصيد 24 واستخدم 18، ففي 2027-03-15 يُرحَّل 6، وإذا حُددت السنة الجديدة بـ21 يصبح الرصيد 27. (4) يُخصم من الأيام المضافة أولًا ثم من رصيد السنة الحالية. (5) تُحسب أيام دوام الموظف فقط، دون الإجازات الأسبوعية والرسمية. (6) حجز عند التقديم، وخصم عند الاعتماد النهائي، وفك الحجز عند الرفض. (7) لا يُسمح بتجاوز الرصيد إلا إذا أضاف مدير الموارد البشرية أيامًا. (8) الإجازة الممتدة بين سنتين تُقسم أيامها على السنتين تلقائيًا. (9) الزمنيات تُخصم من حصة الساعات الشهرية، والزيادة من الرصيد السنوي، حسب إعدادي الساعات المسموحة في الشهر وكم ساعة تساوي يومًا. (10) الرصيد ناتج عن حركات الدفتر، والحركات لا تُحذف، والتصحيح بحركة عكسية. المدير التنفيذي: لا يقدم إجازة ولا رصيد له، وغير مشمول بالحضور حسب الافتراض الحالي. دوره خارج x-allowed-roles لهذه العمليات. إذا حمل دورًا آخر، أو استُهدف بمعرفه، تُعيد عمليات الإجازة Hr:Leave:ExecutiveDirectorNotEligible وعمليات الحضور Hr:Attendance:ExecutiveDirectorNotCovered. الوقت: حقول HH:mm والتواريخ بتوقيت الشركة في AttendanceSettingsDto.timeZone، وحقول date-time بصيغة UTC. قيم الأيام والساعات decimal لدقة 4 منازل. x-data-scope يذكر أوسع نطاق للعملية، ووصف العملية يحدد نطاق كل دور. x-release هو رقم المرحلة في القسم 12، والدوام والإجازات في المرحلة 2. إعدادات الزمنيات مملوكة لوحدة identity-org عبر /api/app/system-settings/hourly-leave."
tags:
  - name: WorkShift
    description: "قوالب الدوام وربط الموظفين بها."
  - name: Holiday
    description: "العطل الرسمية والأسبوعية."
  - name: Attendance
    description: "قراءة الحضور."
  - name: AttendanceDevice
    description: "الأجهزة وربط مستخدميها واستقبال العمليات الخام."
  - name: AttendanceImport
    description: "استيراد ملفات الحضور."
  - name: AttendanceSettings
    description: "طريقة الحضور."
  - name: AttendanceCorrection
    description: "طلب تصحيح البصمة."
  - name: AttendanceGps
    description: "حضور GPS ومناطق العمل (لاحقًا)."
  - name: LeaveBalance
    description: "الرصيد والاستحقاق والتعديل والحركات."
  - name: LeaveRequest
    description: "معاينة وتقديم وقراءة طلبات الإجازة."
  - name: OtherLeaveType
    description: "الأنواع الأخرى."
  - name: LeaveCalendar
    description: "تقويم إجازات الفريق."

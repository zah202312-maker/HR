          type: string
    WeeklyOffSettingUpdateDto:
      type: object
      required: [days, concurrencyStamp]
      properties:
        days:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WorkShiftDayOfWeek"
        concurrencyStamp:
          type: string
    AttendanceCaptureMethod:
      type: string
      description: "device = البصمة، gps = GPS عند إضافته، both = الاثنان."
      enum: [device, gps, both]
    AttendanceSettingsDto:
      type: object
      required: [method, gpsAvailable, timeZone, concurrencyStamp]
      properties:
        method:
          $ref: "#/components/schemas/AttendanceCaptureMethod"
        gpsAvailable:
          type: boolean
          description: "false حتى إطلاق ميزة GPS. عندها لا تظهر خيارات gps وboth ولا زر تسجيل الحضور بالموقع."
        timeZone:
          type: string
          description: "معرف IANA لتوقيت الشركة. تُفسَّر به كل حقول الوقت HH:mm وتحديد اليوم."
        concurrencyStamp:
          type: string
    AttendanceSettingsUpdateDto:
      type: object
      required: [method, timeZone, concurrencyStamp]
      properties:
        method:
          $ref: "#/components/schemas/AttendanceCaptureMethod"
        timeZone:
          type: string
          description: "معرف IANA صالح."
        concurrencyStamp:
          type: string
    AttendancePunchSource:
      type: string
      enum: [device, file, gps]
    AttendanceDayStatus:
      type: string
      description: "present = حاضر. late = متأخر بعد السماح. absent = غائب في يوم دوام. incomplete = بصمة واحدة فقط. onLeave = إجازة معتمدة تغطي اليوم. holiday = عطلة رسمية. weeklyOff = يوم راحة في وردية الموظف. noShift = لا يوجد ربط دوام في هذا التاريخ."
      enum: [present, late, absent, incomplete, onLeave, holiday, weeklyOff, noShift]
    AttendancePunchType:
      type: string
      description: "نوع المشكلة في طلب التصحيح: دخول أو خروج."
      enum: [checkIn, checkOut]
    AttendanceDayDto:
      type: object
      required: [id, employee, date, status, lateMinutes, workedMinutes, overtimeMinutes, isCorrected]
      properties:
        id:
          type: string
          format: uuid
        employee:
          $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
        date:
          type: string
          format: date

  /api/app/leave-request:
    post:
      operationId: LeaveRequest_Create
      tags: [LeaveRequest]
      summary: "Create a leave request"
      description: "ينشئ الطلب العام وتفاصيل الإجازة في معاملة واحدة، بأحد الأنواع الثلاثة. hourly: date وfromTime وtoTime. annual: startDate وendDate. other: otherLeaveTypeId والتواريخ والمرفق حسب النوع. القواعد: الأيام المحسوبة هي أيام دوام الموظف حسب ورديته، دون الراحة الأسبوعية والعطل الرسمية. الخصم من الأيام المضافة أولًا ثم رصيد السنة الحالية. الإجازة الممتدة بين سنتين من سنوات الموظف تُقسم تلقائيًا في segments، ولكل سنة ترتيب الخصم نفسه. الزمنية تُحسب من حصة الشهر التقويمي لتاريخها (monthlyAllowedHours في /api/app/system-settings/hourly-leave)، والزيادة تُحوَّل بقسمتها على hoursPerDay من الإعداد نفسه وتُخصم من الرصيد السنوي. الأنواع الأخرى لا تخصم من السنوي إلا إذا كان deductsFromAnnualBalance = true. لا يُسمح بتجاوز الرصيد إلا إذا أضاف مدير الموارد البشرية أيامًا عبر adjust. دورة الرصيد: حجز (hold) عند التقديم، وخصم (deduct) عند الاعتماد النهائي، وفك الحجز (release) عند الرفض أو الإلغاء. نقص الرصيد يعطي Hr:Leave:InsufficientBalance وفي error.data: availableDays وrequestedDays وshortageDays. لا تتداخل إجازة مع إجازة معلقة أو معتمدة للموظف نفسه. الموافقة عبر /api/app/request/{id}/approve وreject وcancel. المسار: الموظف: pendingManager (مدير القسم) ثم pendingHr ثم approved. مدير القسم: pendingManager (مسؤول النظام) ثم pendingHr ثم approved. مدير الموارد البشرية ومسؤول النظام: pendingExecutive ثم approved. عند الرفع نيابة (مدير القسم لموظف من فريقه فقط، وغير ذلك 403): يسجل المقدم الفعلي ويُشعر الموظف، ويبدأ من pendingHr. لا يعتمد أحد طلبه. بعد الاعتماد النهائي تظهر أيام الحضور بالحالة onLeave. يُشعر المعتمد التالي ومقدم الطلب. المدير التنفيذي لا يقدم إجازة: دوره خارج الأدوار المسموحة، وإذا حمل دورًا آخر أو قُدم الطلب باسمه يعطي Hr:Leave:ExecutiveDirectorNotEligible."
      x-source: ["4", "5.4", "5.5", "10", "12"]
      x-release: 2
      x-allowed-roles: [employee, departmentManager, hrManager, systemAdmin]
      x-permission: Hr.Leave.Request.Create
      x-data-scope: self
      x-error-codes: ["Hr:Leave:ExecutiveDirectorNotEligible", "Hr:Leave:EmployeeNotActive", "Hr:Leave:EntitlementNotSet", "Hr:Leave:NoShiftAssigned", "Hr:Leave:InvalidDateRange", "Hr:Leave:NoWorkingDaysInRange", "Hr:Leave:RangeBeyondNextYear", "Hr:Leave:InsufficientBalance", "Hr:Leave:OverlappingLeave", "Hr:Leave:HourlySettingsNotConfigured", "Hr:Leave:HourlyOutsideShift", "Hr:Leave:OtherLeaveTypeInactive", "Hr:Leave:NotEligibleForLeaveType", "Hr:Leave:OtherLeaveTypeMaxExceeded", "Hr:Leave:AttachmentRequired", "Hr:Leave:InvalidAttachment"]
      x-open-question: "كيف يُحسب المتاح لجزء يقع في سنة الموظف القادمة قبل فتحها؟ المعتمد هنا: المتبقي المتوقع ترحيله بعد هذا الطلب + nextYearEntitlementDays، مع حد أقصى هو السنة القادمة فقط. وهل يُسمح بالتواريخ الماضية؟ المعتمد: نعم، إذ لا تمنعها الوثيقة. وهل تُحسب الأنواع الأخرى كالولادة بأيام الدوام فقط؟ المعتمد: نعم، حسب جدول القواعد. وماذا عن الإجازة المعتمدة إذا أُلغيت؟ وهل تنتقل إلى completed؟ المعتمد هنا: الإلغاء أثناء التعليق فقط، والحالة النهائية للإجازة approved، والتصحيح بعد الاعتماد بحركة reverse أو adjust. وإذا رُفض طلب بعد إغلاق سنته، يُضاف المحجوز المفكوك إلى الأيام المضافة في السنة الجديدة."

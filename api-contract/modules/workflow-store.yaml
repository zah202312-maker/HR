                    name: "قطعة من المخزن"
                    destination: store
                    usesDedicatedEndpoint: false
                    requiresItem: true
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: RequestType_Create
      tags: [Requests]
      summary: "Create a request type"
      description: >-
        ينشئ مسؤول النظام نوع طلب ويحدد جهته، ويسلك مسار المصفوفة الخاص بهذه الجهة. يظهر النوع فورًا للموظفين إذا كان مفعلًا. الرمز المكرر يعيد 422.
      x-source: ["5.5", "5.18"]
      x-release: 1
      x-allowed-roles: [systemAdmin]
      x-permission: Hr.Request.Type.Manage
      x-data-scope: company
      x-error-codes: [Hr:Request:TypeCodeAlreadyExists]
      x-open-question: >-
        الاحتياج الإداري غير موجود كعمود في مصفوفة القسم 4. الافتراض: يسلك عمود جهته المحددة في النوع، والنوع المبذور administrativeNeed جهته none فيتبع عمود الإجازة وتصحيح البصمة. هل هذا صحيح؟

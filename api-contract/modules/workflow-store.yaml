          format: date
          description: "تاريخ الجرد."
        note:
          type: string
          nullable: true
          description: "ملاحظة عامة."
          maxLength: 2000
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CustodyCountLineInputDto"
          description: "سطر لكل عهدة مشتركة قائمة في القسم."
    CustodyCountLineDto:
      type: object
      description: "سطر جرد محفوظ."
      required: [custodyId, item, expectedQuantity, countedQuantity]
      properties:
        custodyId:
          type: string
          format: uuid
          description: "العهدة."
        item:
          $ref: "#/components/schemas/ItemRefDto"
        expectedQuantity:
          type: number
          format: decimal
          description: "الكمية المسجلة وقت الجرد."
        countedQuantity:
          type: number
          format: decimal
          description: "الكمية الموجودة فعليًا."
        note:
          type: string
          nullable: true
          description: "ملاحظة السطر."
    CustodyCountDto:
      type: object
      description: "جرد عهدة قسم. لا يغير العهد ولا الرصيد."
      required: [id, department, countDate, result, countedBy, lines, creationTime]
      properties:
        id:
          type: string
          format: uuid
          description: "معرف الجرد."
        department:
          $ref: "./common.yaml#/components/schemas/DepartmentRefDto"
        countDate:
          type: string
          format: date
          description: "تاريخ الجرد."
        result:
          $ref: "#/components/schemas/CustodyCountResult"
        note:
          type: string
          nullable: true
          description: "ملاحظة عامة."
        countedBy:
          $ref: "./common.yaml#/components/schemas/UserRefDto"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CustodyCountLineDto"
          description: "أسطر الجرد."
        creationTime:
          type: string
          format: date-time
          description: "وقت الإنشاء UTC."
    CustodyCountPagedResultDto:
      type: object
      description: "صفحة من CustodyCountDto."
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustodyCountDto"

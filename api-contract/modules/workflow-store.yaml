openapi: "3.0.3"
info:
  title: "HR System - Workflow and Store"
  version: "1.0.0"
  description: |-
    طلبات عامة، ومطالعات، وبلاغات أعطال، ومخزن، وعهد. الموظف يظهر للجميع هنا عبر EmployeeRefDto.

    ## مصفوفة الموافقات (القسم 4 من الوثيقة، قواعد لا يقررها العميل)

    يبني الخادم الخطوات عند التقديم. القيم بين القوسين هي RequestStatus. الجهة none هي عمود الإجازة وتصحيح البصمة.

    | صاحب الطلب | جهة none (إجازة، تصحيح بصمة) | جهة store (المخزن) | جهة accountant (المحاسب) |
    |---|---|---|---|
    | الموظف، ومنه المراجع والمحاسب ومسؤول المخزن | مدير القسم (pendingManager) ثم الموارد البشرية (pendingHr) ثم approved | مدير القسم (pendingManager) ثم الموارد البشرية (pendingHr) ثم المخزن (pendingDestination) ثم completed | مدير القسم (pendingManager) ثم الموارد البشرية (pendingHr) ثم المحاسب (pendingDestination) ثم completed |
    | مدير القسم | مسؤول النظام (pendingManager) ثم الموارد البشرية (pendingHr) ثم approved | مسؤول النظام (pendingManager) ثم الموارد البشرية (pendingHr) ثم المخزن (pendingDestination) ثم completed | مسؤول النظام (pendingManager) ثم الموارد البشرية (pendingHr) ثم المحاسب (pendingDestination) ثم completed |
    | مدير الموارد البشرية | المدير التنفيذي (pendingExecutive) ثم approved | المخزن مباشرة (pendingDestination) ثم completed | المدير التنفيذي (pendingExecutive) ثم المحاسب (pendingDestination) ثم completed |
    | المدير التنفيذي | لا يقدم إجازة: Hr:Request:ExecutiveCannotSubmit | المخزن مباشرة (pendingDestination) ثم completed | المحاسب مباشرة (pendingDestination) ثم completed |
    | مسؤول النظام | المدير التنفيذي (pendingExecutive) ثم approved | المدير التنفيذي (pendingExecutive) ثم المخزن (pendingDestination) ثم completed | المدير التنفيذي (pendingExecutive) ثم المحاسب (pendingDestination) ثم completed |

    قواعد ملزمة:

    - مديرو الأقسام يمرون عبر مسؤول النظام لأنه المدير الأعلى لهم. لا توجد قيمة حالة خاصة به، فالحالة pendingManager وcurrentApproverRole = systemAdmin.
    - لا توجد مهلة موافقة. يبقى الطلب معلقًا حتى يوافق المسؤول أو يرفض، ولا يتضمن أي DTO موعدًا نهائيًا.
    - يصل تذكير دوري للمعتمد الحالي دون أي إجراء تلقائي: لا موافقة، ولا رفض، ولا تصعيد، ولا تغيير حالة. مواعيده من إعدادات مسؤول النظام.
    - لا يعتمد أحد طلبه الشخصي، مهما كانت أدواره أو تفويضاته. يطبق الخادم ذلك ويعيد Hr:Request:SelfApprovalNotAllowed، ولا يظهر الطلب في صندوقه.
    - الرفض في أي خطوة ينهي الطلب بالحالة rejected، ويظهر السبب للموظف.
    - مدير القسم يقدم نيابة عن موظف فريقه: يُسجل المقدم الفعلي، ويُشعر الموظف، وتُعد موافقته الأولى تمت، ويبدأ الطلب من pendingHr.
    - المفوض البديل اختياري ومسجل بمدة وسبب، والقرار يُسجل باسمه مع صاحب الصلاحية الأصلي.
    - عند تغيير مدير الموظف تنتقل الطلبات المعلقة إلى المدير الجديد.

    ## ما يراه الموظف

    الحالات: بانتظار مدير القسم (pendingManager)، بانتظار الموارد البشرية (pendingHr)، موافق عليه (approved)، مرفوض (rejected)، مكتمل (completed). شاشات مقدم الطلب تعرض RequestEmployeeStatus وstatusLabel، وليس RequestStatus. لذلك pendingDestination تظهر له «موافق عليه»، وcurrentStageRole وحالة الصرف يبينان أين وصل الطلب.

    ## عقود مع وحدات أخرى

    - طلبا الإجازة وتصحيح البصمة ينشآن من POST /api/app/leave-request وPOST /api/app/attendance-correction في وحدتيهما، بسجل Request والمصفوفة نفسها، ويتخذ القرار فيهما عبر approve وreject هنا. ويظهران في my وinbox.
    - إنشاء المصروف من حركة المخزن في وحدة المحاسبة، عبر حدث موثوق.
    - GET /api/app/employee/lookup وGET /api/app/department ومسارات /api/app/delegation في identity-org.yaml. التفويض يُدار هناك، وتظهر آثاره هنا في delegatedFrom.
    - قوالب الإشعارات من NotificationTemplateCode في identity-org.yaml: requestPendingAction, requestStatusChanged, requestSubmittedOnBehalf, requestApprovalReminder, memoUpdate, incidentUpdate, stockIssuePending, custodyAssigned.

    ## x-release

    1 يعني ما قبل الإطلاق التجريبي (المراحل 0 إلى 3 في القسم 12)، و2 يعني المرحلة 4 وفيها المخزن والعهد. لذلك لا تُفعَّل أنواع الجهة store قبل الإصدار 2، ويكون itemId في البلاغ null حتى ذلك الحين.

    ## نموذج الحالات في المخزن

    الصرف: pendingAcknowledgement ثم acknowledged ثم (purchasing إن لم يتوفر) ثم delivered. الوثيقة تذكر الثلاث الأخيرة، وأضيفت pendingAcknowledgement لما قبل «اطلعت» وcancelled لما بعد رفض الطلب أو إلغائه.

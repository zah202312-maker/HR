components:
  securitySchemes:
    oauth2:
      $ref: "./common.yaml#/components/securitySchemes/oauth2"
  schemas:
    RequestStatus:
      type: string
      description: |-
        الحالة الفعلية للطلب في مسار الموافقة. يستخدمها المعتمدون والموارد البشرية، وتشير إليها الوحدات الأخرى.
        pendingManager: بانتظار الموافقة الأولى. المعتمد مدير القسم المرتبط بالموظف، أو مسؤول النظام إذا كان مقدم الطلب مدير قسم (currentApproverRole يحدد ذلك).
        pendingHr: بانتظار الموارد البشرية.
        pendingExecutive: بانتظار المدير التنفيذي.
        pendingDestination: انتهت الموافقات أو لا تلزم، وبانتظار تنفيذ الجهة: المخزن أو المحاسب.
        approved: موافق عليه نهائيًا لطلب بلا جهة تنفيذ (إجازة، تصحيح بصمة، destination = none). حالة نهائية.
        rejected: مرفوض في إحدى الخطوات. حالة نهائية.
        completed: نفذت جهة التنفيذ الطلب: التسليم للمخزن، أو الإنجاز للمحاسب. حالة نهائية.
        cancelled: ألغاه مقدمه أو صاحبه. حالة نهائية.
      enum: [pendingManager, pendingHr, pendingExecutive, pendingDestination, approved, rejected, completed, cancelled]
    RequestEmployeeStatus:
      type: string
      description: |-
        الحالة كما يراها مقدم الطلب، وفق القسم 4 من الوثيقة. يجب أن تعرضها شاشات «طلباتي» بدل RequestStatus.
        pendingManager = بانتظار مدير القسم. pendingHr = بانتظار الموارد البشرية. approved = موافق عليه. rejected = مرفوض. completed = مكتمل.
        التحويل من RequestStatus: pendingDestination تظهر approved، والبقية بالاسم نفسه.
        قيمتان خارج قائمة الموظف الخمس في الوثيقة: pendingExecutive (بانتظار المدير التنفيذي) ولا تظهر إلا لمدير الموارد البشرية ومسؤول النظام لأن الموظف العادي لا يمر بهذه الخطوة، وcancelled (ملغى) ولا تظهر إلا بعد إلغاء الطلب.
      enum: [pendingManager, pendingHr, pendingExecutive, approved, rejected, completed, cancelled]
    RequestDestination:
      type: string
      description: >-
        جهة التنفيذ بعد الموافقات. none: الموافقة الأخيرة تنهي الطلب بالحالة approved (عمود الإجازة وتصحيح البصمة في المصفوفة). store: مسؤول المخزن. accountant: المحاسب.
      enum: [none, store, accountant]
    RequestStepDecision:
      type: string
      description: >-
        notReached: لم تصل إليها بعد أو توقف الطلب قبلها. pending: الخطوة الحالية. approved: موافقة، وهي أيضًا إنجاز جهة التنفيذ. approvedBySubmission: عُدت موافقة مدير القسم تمت لأنه قدم الطلب نيابة عن الموظف. rejected: رفض.
      enum: [notReached, pending, approved, approvedBySubmission, rejected]
    RequestInboxActionKind:
      type: string
      description: >-
        decide: الإجراء عبر approve وreject على الطلب. stockIssue: الإجراء عبر مسار /api/app/stock-issue باستخدام stockIssueId.
      enum: [decide, stockIssue]
    RequestTypeDto:
      type: object
      description: "نوع طلب للمستخدم العادي، باسم مترجم."
      required: [id, code, name, destination, usesDedicatedEndpoint, requiresItem]
      properties:
        id:
          type: string
          format: uuid
          description: "معرف النوع."
        code:
          type: string
          description: >-
            رمز ثابت. الأنواع المبذورة: leave, attendanceCorrection, storeItem, accountant, administrativeNeed.
        name:
          type: string
          description: "الاسم حسب Accept-Language."
        destination:
          $ref: "#/components/schemas/RequestDestination"
        usesDedicatedEndpoint:
          type: boolean
          description: >-
            true للنوعين leave وattendanceCorrection. تقديمهما عبر POST /api/app/leave-request وPOST /api/app/attendance-correction وليس POST /api/app/request.
        requiresItem:
          type: boolean
          description: >-
            true عندما destination = store. عندها يلزم itemId وquantity عند التقديم.
    RequestTypePagedResultDto:
      type: object
      description: "صفحة من RequestTypeDto."
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestTypeDto"
    RequestTypeAdminDto:
      type: object
      description: "نوع طلب لمسؤول النظام."
      required: [id, code, nameAr, nameEn, destination, isActive, isSystem, concurrencyStamp, creationTime]
      properties:
        id:
          type: string
          format: uuid
          description: "معرف النوع."
        code:
          type: string
          description: "رمز ثابت وفريد."
        nameAr:
          type: string
          description: "الاسم بالعربية."
        nameEn:
          type: string
          description: "الاسم بالإنجليزية."
        destination:
          $ref: "#/components/schemas/RequestDestination"
        isActive:
          type: boolean
          description: "النوع غير المفعل لا يظهر عند التقديم، وتكمل طلباته القائمة مسارها."
        isSystem:
          type: boolean
          description: "نوع مبذور. لا يتغير رمزه ولا جهته."
        concurrencyStamp:
          type: string
          description: "يُعاد إرساله في التحديث. عدم المطابقة يعيد 409."
        creationTime:
          type: string
          format: date-time
          description: "وقت الإنشاء UTC."
        lastModificationTime:
          type: string
          format: date-time
          nullable: true
          description: "وقت آخر تعديل UTC."
    RequestTypeAdminPagedResultDto:
      type: object
      description: "صفحة من RequestTypeAdminDto."
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestTypeAdminDto"
    RequestTypeCreateInputDto:
      type: object
      description: "إنشاء نوع طلب."
      required: [code, nameAr, nameEn, destination, isActive]
      properties:
        code:
          type: string
          description: "حروف إنجليزية بصيغة camelCase. فريد."
          pattern: "^[a-z][A-Za-z0-9]{1,63}$"
        nameAr:
          type: string
          description: "الاسم بالعربية."
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          description: "الاسم بالإنجليزية."
          minLength: 1
          maxLength: 128
        destination:
          $ref: "#/components/schemas/RequestDestination"
        isActive:
          type: boolean
          description: "تفعيل النوع."
    RequestTypeUpdateInputDto:
      type: object
      description: "تعديل نوع طلب. الرمز لا يتغير."
      required: [nameAr, nameEn, destination, isActive, concurrencyStamp]
      properties:
        nameAr:
          type: string
          description: "الاسم بالعربية."
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          description: "الاسم بالإنجليزية."
          minLength: 1
          maxLength: 128
        destination:
          allOf:
            - $ref: "#/components/schemas/RequestDestination"
          description: "لا يتغير للأنواع المبذورة."
        isActive:
          type: boolean
          description: "تفعيل النوع."
        concurrencyStamp:
          type: string
          description: "آخر قيمة مقروءة."
    RequestTypeRefDto:
      type: object
      description: "مرجع مختصر لنوع الطلب."
      required: [id, code, name, destination]
      properties:
        id:
          type: string
          format: uuid
          description: "معرف النوع."
        code:
          type: string
          description: "الرمز الثابت."
        name:
          type: string
          description: "الاسم حسب Accept-Language."
        destination:
          $ref: "#/components/schemas/RequestDestination"
    RequestSubmitInputDto:
      type: object
      description: "تقديم طلب عام."
      required: [requestTypeId, description]
      properties:
        requestTypeId:
          type: string
          format: uuid
          description: "نوع الطلب."
        onBehalfOfEmployeeId:
          type: string
          format: uuid
          nullable: true
          description: "موظف من فريق مدير القسم عند التقديم نيابة عنه. null للتقديم الشخصي."
        description:
          type: string
          description: "وصف الطلب."
          minLength: 1
          maxLength: 4000
        itemId:
          type: string
          format: uuid
          nullable: true
          description: "الصنف. مطلوب عندما destination = store، ويجب أن يكون null في غيره."
        quantity:
          type: number
          format: decimal
          nullable: true
          description: >-
            الكمية، أكبر من صفر. مطلوبة عندما destination = store، ويجب أن تكون null في غيره.
          minimum: 0
          exclusiveMinimum: true
    MyRequestDto:
      type: object
      description: "طلب في قائمة «طلباتي». لا يحمل RequestStatus عمدًا."

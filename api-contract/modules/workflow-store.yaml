          description: "الرصيد الحالي المحسوب من الحركات."
        isBelowMinimum:
          type: boolean
          description: "quantityOnHand أقل من minQuantity."
        isActive:
          type: boolean
          description: "غير المفعل لا يظهر عند تقديم الطلبات."
        concurrencyStamp:
          type: string
          description: "يُعاد إرساله في التحديث. عدم المطابقة يعيد 409."
        creationTime:
          type: string
          format: date-time
          description: "وقت الإنشاء UTC."
        lastModificationTime:
          type: string
          format: date-time
          nullable: true
          description: "وقت آخر تعديل UTC."
    ItemPagedResultDto:
      type: object
      description: "صفحة من ItemDto."
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemDto"
    ItemCreateInputDto:
      type: object
      description: "إضافة صنف. يبدأ رصيده صفرًا، ويزيد عبر استلام المواد."
      required: [nameAr, nameEn, kind, minQuantity]
      properties:
        nameAr:
          type: string
          description: "الاسم بالعربية."
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          description: "الاسم بالإنجليزية."
          minLength: 1
          maxLength: 128
        kind:
          $ref: "#/components/schemas/ItemKind"
        minQuantity:
          type: number
          format: decimal
          description: "الحد الأدنى."
          minimum: 0
    ItemUpdateInputDto:
      type: object
      description: "تعديل صنف. الرصيد لا يُعدل هنا."
      required: [nameAr, nameEn, kind, minQuantity, isActive, concurrencyStamp]
      properties:
        nameAr:
          type: string
          description: "الاسم بالعربية."
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          description: "الاسم بالإنجليزية."
          minLength: 1
          maxLength: 128
        kind:
          allOf:
            - $ref: "#/components/schemas/ItemKind"
          description: "لا يتغير بعد أول حركة."
        minQuantity:
          type: number
          format: decimal
          description: "الحد الأدنى."
          minimum: 0
        isActive:
          type: boolean
          description: "تفعيل الصنف."
        concurrencyStamp:
          type: string
          description: "آخر قيمة مقروءة."
    StockMovementType:
      type: string
      description: >-
        receive: دخول مواد. issue: تسليم أو عهدة مخصومة من المخزن. return: إرجاع عهدة إلى المخزن. adjustment: تصحيح بحركة عكسية.
      enum: [receive, issue, return, adjustment]
    StockReceiveInputDto:
      type: object
      description: >-
        تسجيل دخول مواد. totalCost حقل كتابة فقط، ولا يعود في أي DTO لمسؤول المخزن.
      required: [itemId, quantity]
      properties:
        itemId:
          type: string
          format: uuid
          description: "الصنف."
        quantity:
          type: number
          format: decimal
          description: "الكمية الداخلة، أكبر من صفر."
          minimum: 0
          exclusiveMinimum: true
        totalCost:
          type: number
          format: decimal
          nullable: true
          description: >-
            إجمالي تكلفة الشراء. عند وجوده ينشأ مصروف عند المحاسب. مطلوب إذا وُجد stockIssueId.
          minimum: 0
          exclusiveMinimum: true
        stockIssueId:
          type: string
          format: uuid
          nullable: true
          description: >-
            طلب الصرف الذي اشتُريت له المواد. يجب أن تكون حالته purchasing وأن يطابق الصنف.
        note:
          type: string
          nullable: true
          description: "ملاحظة."
          maxLength: 2000
    StockAdjustInputDto:
      type: object
      description: "تصحيح رصيد بحركة عكسية."
      required: [itemId, quantity, reason]
      properties:
        itemId:
          type: string
          format: uuid
          description: "الصنف."
        quantity:
          type: number
          format: decimal
          description: "الكمية بإشارة: موجبة تزيد الرصيد وسالبة تنقصه. لا تكون صفرًا."
        reason:
          type: string
          description: "سبب التصحيح."
          minLength: 1
          maxLength: 2000
        reversesMovementId:
          type: string
          format: uuid
          nullable: true
          description: "الحركة التي يعكسها التصحيح، إن وُجدت."
    StockMovementDto:
      type: object
      description: >-
        حركة مخزن. لا تُعدل ولا تُحذف، ولا تحوي تكلفة لأن مسؤول المخزن هو قارئها.
      required: [id, item, type, quantity, balanceAfter, performedBy, creationTime]
      properties:
        id:
          type: string
          format: uuid
          description: "معرف الحركة."
        item:
          $ref: "#/components/schemas/ItemRefDto"
        type:
          $ref: "#/components/schemas/StockMovementType"
        quantity:
          type: number
          format: decimal
          description: "الكمية بإشارة: موجبة للدخول والإرجاع، وسالبة للتسليم."
        balanceAfter:
          type: number
          format: decimal
          description: "رصيد الصنف بعد الحركة."
        requestId:
          type: string
          format: uuid
          nullable: true
          description: "الطلب المرتبط."
        stockIssueId:
          type: string
          format: uuid
          nullable: true
          description: "الصرف المرتبط."
        custodyId:
          type: string
          format: uuid
          nullable: true
          description: "العهدة المرتبطة."
        reversesMovementId:
          type: string
          format: uuid
          nullable: true
          description: "الحركة المعكوسة."
        employee:
          allOf:
            - $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
          nullable: true
          description: "الموظف المستلم أو المرجع."
        performedBy:
          $ref: "./common.yaml#/components/schemas/UserRefDto"
        note:
          type: string
          nullable: true
          description: "الملاحظة أو سبب التصحيح."
        creationTime:
          type: string
          format: date-time
          description: "وقت الإنشاء UTC."
    StockMovementPagedResultDto:
      type: object
      description: "صفحة من StockMovementDto."
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockMovementDto"
    StockIssueStatus:
      type: string
      description: >-
        pendingAcknowledgement: وصل إلى مسؤول المخزن ولم يطلع. acknowledged: «اطلعت». purchasing: «بانتظار الشراء». delivered: «تم التسليم». cancelled: انتهى لأن الطلب رُفض أو أُلغي قبل التسليم.
      enum: [pendingAcknowledgement, acknowledged, purchasing, delivered, cancelled]
    CustodyKind:
      type: string
      description: "personal: شخصية باسم موظف. shared: مشتركة باسم قسم."
      enum: [personal, shared]
    CustodyStatus:
      type: string
      description: >-
        pendingAcknowledgement: بانتظار تأكيد الاستلام. acknowledged: تأكد الاستلام. returned: أُرجعت.
      enum: [pendingAcknowledgement, acknowledged, returned]
    StockIssueStatusDto:
      type: object
      description: "حالة الصرف كما تظهر داخل تفاصيل الطلب. دون أرصدة المخزن."
      required: [id, item, quantity, status, statusLabel]
      properties:
        id:
          type: string
          format: uuid
          description: "معرف الصرف."
        item:
          $ref: "#/components/schemas/ItemRefDto"
        quantity:
          type: number
          format: decimal
          description: "الكمية المطلوبة."
        status:
          $ref: "#/components/schemas/StockIssueStatus"
        statusLabel:
          type: string
          description: "نص الحالة حسب Accept-Language."
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          description: "وقت التسليم."
        custodyId:
          type: string
          format: uuid
          nullable: true
          description: "العهدة الناتجة."
    StockIssueDto:
      type: object
      description: "طلب صرف لمسؤول المخزن. الموظف عبر EmployeeRefDto فقط."
      required: [id, requestId, item, quantity, quantityOnHand, isAvailable, status, statusLabel, employee, creationTime]
      properties:
        id:
          type: string
          format: uuid
          description: "معرف الصرف."
        requestId:
          type: string
          format: uuid
          description: "الطلب الأصلي."
        item:
          $ref: "#/components/schemas/ItemRefDto"
        quantity:
          type: number
          format: decimal
          description: "الكمية المطلوبة."
        quantityOnHand:
          type: number
          format: decimal
          description: "رصيد الصنف الآن."
        isAvailable:
          type: boolean
          description: "quantityOnHand لا يقل عن quantity."
        status:
          $ref: "#/components/schemas/StockIssueStatus"
        statusLabel:
          type: string
          description: "نص الحالة حسب Accept-Language."
        employee:
          allOf:
            - $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
          description: "صاحب الطلب: الاسم والقسم فقط."
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
          description: "وقت «اطلعت»."
        acknowledgedBy:
          allOf:
            - $ref: "./common.yaml#/components/schemas/UserRefDto"
          nullable: true
          description: "من أشر «اطلعت»."
        purchasingAt:
          type: string
          format: date-time
          nullable: true
          description: "وقت «بانتظار الشراء»."
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          description: "وقت التسليم."
        deliveredBy:
          allOf:
            - $ref: "./common.yaml#/components/schemas/UserRefDto"
          nullable: true
          description: "من سلم."
        custodyId:
          type: string
          format: uuid
          nullable: true
          description: "العهدة الناتجة. null للمستهلك وقبل التسليم."
        stockMovementId:
          type: string
          format: uuid
          nullable: true
          description: "حركة الخصم بعد التسليم."
        creationTime:
          type: string
          format: date-time
          description: "وقت الإنشاء UTC."
    StockIssuePagedResultDto:
      type: object
      description: "صفحة من StockIssueDto."
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockIssueDto"
    StockIssueDeliverInputDto:
      type: object
      description: "تسليم الصنف."
      properties:
        custodyKind:
          allOf:
            - $ref: "#/components/schemas/CustodyKind"
          nullable: true
          description: >-
            للصنف الذي يُسترد فقط. null تعني personal باسم صاحب الطلب. shared تنشئ العهدة باسم قسم صاحب الطلب. تُهمل للمستهلك.
        note:
          type: string
          nullable: true
          description: "ملاحظة التسليم."
          maxLength: 2000
    CustodyCreateInputDto:
      type: object
      description: >-
        إضافة عهدة مباشرة. personal: employeeId مطلوب وdepartmentId = null. shared: departmentId مطلوب وemployeeId = null.
      required: [itemId, kind, quantity, deductFromStock]
      properties:
        itemId:
          type: string
          format: uuid
          description: "صنف من نوع returnable."
        kind:
          $ref: "#/components/schemas/CustodyKind"
        employeeId:
          type: string
          format: uuid
          nullable: true
          description: "الموظف، من GET /api/app/employee/lookup."
        departmentId:
          type: string
          format: uuid
          nullable: true
          description: "القسم، من GET /api/app/department."
        quantity:
          type: number
          format: decimal
          description: "الكمية، أكبر من صفر."
          minimum: 0
          exclusiveMinimum: true
        deductFromStock:
          type: boolean
          description: >-
            true: تسليم فعلي الآن من رصيد المخزن بحركة issue. false: تسجيل عهدة موجودة أصلًا عند الموظف أو القسم دون حركة.
        note:
          type: string
          nullable: true
          description: "ملاحظة."
          maxLength: 2000
    CustodyDto:
      type: object
      description: >-
        عهدة. تحمل employee أو department، وليس الاثنين معًا: employee غير null فقط عندما kind = personal، وdepartment غير null فقط عندما kind = shared.
      required: [id, item, kind, quantity, status, assignedAt, assignedBy]
      properties:
        id:
          type: string
          format: uuid
          description: "معرف العهدة."
        item:
          $ref: "#/components/schemas/ItemRefDto"
        kind:
          $ref: "#/components/schemas/CustodyKind"
        employee:
          allOf:
            - $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
          nullable: true
          description: "صاحب العهدة الشخصية."
        department:
          allOf:
            - $ref: "./common.yaml#/components/schemas/DepartmentRefDto"
          nullable: true
          description: "قسم العهدة المشتركة."
        quantity:
          type: number
          format: decimal
          description: "الكمية."
        status:
          $ref: "#/components/schemas/CustodyStatus"
        assignedAt:
          type: string
          format: date-time
          description: "وقت التسجيل."
        assignedBy:
          $ref: "./common.yaml#/components/schemas/UserRefDto"
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
          description: "وقت تأكيد الاستلام."
        acknowledgedBy:
          allOf:
            - $ref: "./common.yaml#/components/schemas/UserRefDto"
          nullable: true
          description: "من أكد الاستلام."
        returnedAt:
          type: string
          format: date-time
          nullable: true
          description: "وقت الإرجاع."
        requestId:
          type: string
          format: uuid
          nullable: true
          description: "الطلب المصدر."
        stockIssueId:
          type: string
          format: uuid
          nullable: true
          description: "الصرف المصدر. null للعهدة المباشرة."
        note:
          type: string
          nullable: true
          description: "ملاحظة."
    CustodyPagedResultDto:
      type: object
      description: "صفحة من CustodyDto."
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustodyDto"
    CustodyReturnInputDto:
      type: object
      description: "إرجاع عهدة كاملة."
      required: [restock]
      properties:
        restock:
          type: boolean
          description: >-
            true: تعود الكمية إلى الرصيد بحركة return. false: لا تعود، مثل التلف، ويصبح note مطلوبًا.
        note:
          type: string
          nullable: true
          description: "ملاحظة الإرجاع."
          maxLength: 2000
    CustodyCountResult:
      type: string
      description: "matched: كل الكميات مطابقة. discrepancy: يوجد فرق."
      enum: [matched, discrepancy]
    CustodyCountLineInputDto:
      type: object
      description: "سطر جرد."
      required: [custodyId, countedQuantity]
      properties:
        custodyId:
          type: string
          format: uuid
          description: "عهدة مشتركة قائمة في القسم."
        countedQuantity:
          type: number
          format: decimal
          description: "الكمية الموجودة فعليًا."
          minimum: 0
        note:
          type: string
          nullable: true
          description: "ملاحظة السطر."
          maxLength: 2000
    CustodyCountCreateInputDto:
      type: object
      description: "جرد عهدة قسم."

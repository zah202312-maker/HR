      x-source: ["5.5", "10"]
      x-release: 1
      x-allowed-roles: [employee, departmentManager, hrManager, executiveDirector, reviewer, accountant, storeOfficer, systemAdmin]
      x-permission: Hr.Request.Type.View
      x-data-scope: public
      x-error-codes: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
        - $ref: "./common.yaml#/components/parameters/SkipCount"
        - $ref: "./common.yaml#/components/parameters/MaxResultCount"
        - $ref: "./common.yaml#/components/parameters/Sorting"
      responses:
        "200":
          description: "نجحت العملية."
          content:

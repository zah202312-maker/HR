      x-error-codes: [Hr:Request:TypeInactive, Hr:Request:UseDedicatedEndpoint, Hr:Request:ExecutiveCannotSubmit, Hr:Request:OnBehalfNotAllowed, Hr:Request:ItemFieldsInvalid, Hr:Request:ItemInactive, Hr:Request:NoApproverAvailable]

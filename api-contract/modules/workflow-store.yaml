      summary: "Submit a request, personally or on behalf of an employee"
      description: >-
        يبني الخادم خطوات الطلب عند التقديم من مصفوفة القسم 4 (انظر info.description) حسب صاحب الطلب وجهة النوع، ولا يختار العميل المسار. التقديم نيابة عن موظف: لمدير القسم فقط وعلى موظف من فريقه، وغير ذلك 403، ويعيد Hr:Request:OnBehalfNotAllowed إذا لم يكن صاحب الطلب في صف الموظف. يُحفظ المقدم الفعلي في submittedBy، وتُسجل خطوة المدير approvedBySubmission، ويبدأ الطلب من pendingHr، ويصل إشعار للموظف. نوعا leave وattendanceCorrection يُقدمان من مساريهما المخصصين ويعيدان هنا Hr:Request:UseDedicatedEndpoint. المدير التنفيذي لا يقدم طلبًا جهته none. مدير الموارد البشرية والمدير التنفيذي يبدأ طلبهما إلى المخزن مباشرة بالحالة pendingDestination وينشأ الصرف فورًا، وكذلك طلب المدير التنفيذي إلى المحاسب. يصل إشعار إلى أول معتمد بلغة المستلم. لا تُحدد مهلة موافقة.

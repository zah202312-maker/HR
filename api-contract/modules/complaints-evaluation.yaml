openapi: "3.0.3"
info:
  title: "HR System - Complaints, Evaluation, Reports and Circulars"
  version: "1.0.0"
  description: |-
    يغطي البنود 3 و5.8 إلى 5.12 من وثيقة المتطلبات، وهو أكثر وحدات النظام حساسية.

    قواعد عامة في هذا الملف:
    - كل نجاح يرد 200، حسب سلوك ABP الافتراضي.
    - كل معرفات {id} في المسارات مقيدة بنوع GUID في التوجيه، لذلك لا تتعارض مع المقاطع الثابتة مثل my وteam وassigned وsent.
    - لا يوجد أي مسار حذف أو تعديل مباشر لشكوى. القاعدة المحمية 5: الشكاوى لا تُحذف.
    - خدمات الشكاوى تحمل [DisableAuditing]، ويحل محل التدقيق العام جدول ComplaintAccessLogs. محتوى الشكوى لا يدخل أي سجل تطبيق أو تقرير خطأ.
    - القواعد المحمية في البند 3 لا تتغير من الإعدادات، ولا يتجاوزها تعدد الأدوار: لا يرى المشتكى عليه الشكوى ضده، ولا يرى مسؤول النظام المحتوى، وتعيين المعالج يحتاج موافقة المدير التنفيذي.
    - مهلة تأخر الشكاوى وتوقيت الدورة الشهرية إعدادات لمسؤول النظام معرفة في hr-finance-system.yaml تحت system-settings/complaints وsystem-settings/reminders، وهذا الملف يصف أثرها فقط حتى يبقى للإعداد مصدر واحد.
    - الحقل غير المسموح لجمهور معين غائب من DTO ذلك الجمهور، وليس null.
    - x-allowed-roles في مسارات الشكاوى للمعالجين شرط أولي فقط. القرار النهائي لـComplaintAccessPolicy، وصاحب التعيين المعتمد يعد معالجًا أيًا كانت أدواره.
    - x-data-scope يصف النطاق الأضيق للدور الأساسي، والوصف يحدد الأدوار الأخرى.
    - x-release: 1 يعني المراحل 0 إلى 3 والإطلاق التجريبي، و2 المرحلة 4، و3 المرحلة 5، حسب البند 12.
tags:
  - name: Complaints
    description: "الشكاوى: التقديم والمعالجة وسجل الاطلاع."
  - name: ComplaintHandlers
    description: "تعيين معالجي الشكاوى بموافقة المدير التنفيذي."
  - name: Evaluations
    description: "التقييم الشهري بعروض منفصلة للمدير والموظف والموارد البشرية، والملاحظات الداخلية."
  - name: EvaluationAdmin
    description: "معايير التقييم والسلم اللفظي."
  - name: DepartmentReports
    description: "التقرير الشهري للقسم."
  - name: Reports
    description: "تقارير مدير القسم والمراجع والموارد البشرية والتصدير."
  - name: Circulars
    description: "التعاميم وتأكيد الاستلام."
security:
  - oauth2: ["HR_Mangment2"]
paths:
  /api/app/complaint/respondents:
    get:
      operationId: Complaint_GetRespondents
      tags: ["Complaints"]
      summary: List selectable complaint respondents
      description: |-
        قائمة من يمكن تقديم شكوى ضدهم.
        تُستبعد دائمًا من الخادم، وليس من الواجهة: كل مستخدم يملك دور المدير التنفيذي أو مسؤول النظام، حتى لو كان له دور آخر، والمستخدم المستدعي نفسه، والحسابات غير النشطة.
        تعرض الاسم والقسم فقط، دون دور أو فئة. هذه القراءة لا تسجل في سجل الاطلاع لأنها لا تخص شكوى محددة.
      x-source: ["5.8", "3"]
      x-release: 1
      x-allowed-roles: ["employee", "departmentManager"]
      x-permission: Hr.Complaints.Submit
      x-data-scope: company
      x-error-codes: []
      parameters:
        - name: filter
          in: query
          required: false
          description: "بحث بالاسم."
          schema:
            type: string
            maxLength: 200
        - $ref: "./common.yaml#/components/parameters/SkipCount"
        - $ref: "./common.yaml#/components/parameters/MaxResultCount"
        - $ref: "./common.yaml#/components/parameters/Sorting"
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintRespondentPagedResultDto"
              example:
                totalCount: 1
                items:
                  - id: b94d27c1-1f5e-4a8c-b6d3-0e7a2c4f8a03
                    fullName: "عمر ياسين"
                    departmentName: "قسم المبيعات"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
  /api/app/complaint/preview-routing:
    post:
      operationId: Complaint_PreviewRouting
      tags: ["Complaints"]
      summary: Preview minimum level and route
      description: |-
        يعيد الحد الأدنى للمستوى والمستويات المتاحة ومسار كل مستوى، قبل تقديم الشكوى. لا ينشئ أي بيانات ولا يرسل إشعارًا. يأخذ في الحساب هوية المستدعي، فإذا كان مدير قسم يُحذف مدير القسم من المسار.

        جدول التوجيه الكامل (البند 5.8)، وقواعده ثابتة في الكود داخل ComplaintRoutingService ولا تعدلها الإعدادات:

        | الحالة | المستوى | المسار |
        |---|---|---|
        | زميل، أو شكوى عامة (targetKind = general) | الحد الأدنى normal، ويمكن للموظف رفعها | normal: مدير القسم ← مدير الموارد البشرية. confidential: مدير الموارد البشرية مباشرة. highlyConfidential: المدير التنفيذي |
        | يختارها الموظف سرية | confidential | مدير الموارد البشرية مباشرة |
        | مدير القسم هو المشتكى عليه | الحد الأدنى confidential | confidential: مدير الموارد البشرية مباشرة. highlyConfidential: المدير التنفيذي |
        | مسؤول المخزن هو المشتكى عليه | حسب اختيار الموظف، والحد الأدنى normal | normal أو confidential: مدير الموارد البشرية مباشرة دون مدير القسم. highlyConfidential: المدير التنفيذي |
        | مدير الموارد البشرية هو المشتكى عليه | highlyConfidential إجباريًا | المدير التنفيذي |
        | يختارها الموظف سرية جدًا | highlyConfidential | المدير التنفيذي |
        | المراجع هو المشتكى عليه | highlyConfidential إجباريًا | المدير التنفيذي، ولا يطلع عليها المراجع ولا تدخل في أعداده |
        | المدير التنفيذي | غير متاحة | لا توجد جهة أعلى منه داخل النظام، ولا يظهر في قائمة المشتكى عليهم |
        | مسؤول النظام | غير متاحة | لا يظهر في قائمة المشتكى عليهم |
        | مقدم الشكوى مدير قسم | حسب المشتكى عليه | لا تمر بأي مدير، وتذهب مباشرة إلى الجهة المعالجة: normal أو confidential إلى مدير الموارد البشرية، وhighlyConfidential إلى المدير التنفيذي |

        إذا جمع المشتكى عليه أكثر من دور تُطبق القاعدة الأشد، أي أعلى حد أدنى وأعلى جهة معالجة، حتى لا يتجاوز تعدد الأدوار القواعد المحمية.

        الأخطاء: RespondentNotAllowed إذا كان المشتكى عليه مديرًا تنفيذيًا أو مسؤول نظام، وSelfComplaintNotAllowed إذا كان هو المستدعي.
      x-source: ["5.8"]
      x-release: 1
      x-allowed-roles: ["employee", "departmentManager"]
      x-permission: Hr.Complaints.Submit
      x-data-scope: self
      x-error-codes: ["Hr:Complaints:RespondentRequired", "Hr:Complaints:RespondentNotAllowed", "Hr:Complaints:SelfComplaintNotAllowed"]
      x-open-question: "لم يذكر جدول 5.8 المحاسب مشتكى عليه. العقد يعامله كزميل (الحد الأدنى normal ومسار مدير القسم ← الموارد البشرية). هل هذا صحيح، أم يأخذ مسار مسؤول المخزن؟"
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintRoutingPreviewInputDto"
            example:
              targetKind: employee
              respondentId: b94d27c1-1f5e-4a8c-b6d3-0e7a2c4f8a03
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintRoutingPreviewDto"
              example:
                minimumLevel: confidential
                selectableLevels: ["confidential", "highlyConfidential"]
                routes:
                  - level: confidential
                    handlerPath: ["hrManager"]
                  - level: highlyConfidential
                    handlerPath: ["executiveDirector"]
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common.yaml#/components/responses/BusinessRuleViolation"
  /api/app/complaint:
    post:
      operationId: Complaint_Submit
      tags: ["Complaints"]
      summary: Submit a complaint
      description: |-
        تقديم شكوى باسم المستخدم، ولا توجد شكوى مجهولة. اسم مقدم الشكوى يظهر للمعالج.
        يحسب الخادم المستوى الفعلي: إذا كان level أقل من الحد الأدنى يرفعه تلقائيًا ويعيد levelRaisedBySystem = true، ولا يمكن النزول عن هذا الحد. يحدد الخادم الجهة المعالجة، ولا يقبلها من العميل.

        جدول التوجيه الكامل (البند 5.8)، وقواعده ثابتة في الكود داخل ComplaintRoutingService ولا تعدلها الإعدادات:

        | الحالة | المستوى | المسار |
        |---|---|---|
        | زميل، أو شكوى عامة (targetKind = general) | الحد الأدنى normal، ويمكن للموظف رفعها | normal: مدير القسم ← مدير الموارد البشرية. confidential: مدير الموارد البشرية مباشرة. highlyConfidential: المدير التنفيذي |
        | يختارها الموظف سرية | confidential | مدير الموارد البشرية مباشرة |
        | مدير القسم هو المشتكى عليه | الحد الأدنى confidential | confidential: مدير الموارد البشرية مباشرة. highlyConfidential: المدير التنفيذي |
        | مسؤول المخزن هو المشتكى عليه | حسب اختيار الموظف، والحد الأدنى normal | normal أو confidential: مدير الموارد البشرية مباشرة دون مدير القسم. highlyConfidential: المدير التنفيذي |
        | مدير الموارد البشرية هو المشتكى عليه | highlyConfidential إجباريًا | المدير التنفيذي |
        | يختارها الموظف سرية جدًا | highlyConfidential | المدير التنفيذي |
        | المراجع هو المشتكى عليه | highlyConfidential إجباريًا | المدير التنفيذي، ولا يطلع عليها المراجع ولا تدخل في أعداده |
        | المدير التنفيذي | غير متاحة | لا توجد جهة أعلى منه داخل النظام، ولا يظهر في قائمة المشتكى عليهم |
        | مسؤول النظام | غير متاحة | لا يظهر في قائمة المشتكى عليهم |
        | مقدم الشكوى مدير قسم | حسب المشتكى عليه | لا تمر بأي مدير، وتذهب مباشرة إلى الجهة المعالجة: normal أو confidential إلى مدير الموارد البشرية، وhighlyConfidential إلى المدير التنفيذي |

        إذا جمع المشتكى عليه أكثر من دور تُطبق القاعدة الأشد، أي أعلى حد أدنى وأعلى جهة معالجة، حتى لا يتجاوز تعدد الأدوار القواعد المحمية.

        الآثار الجانبية:
        - يُشفر المحتوى بطريقة المغلف، ولا يوضع في سجلات التطبيق أو في سجل التدقيق العام، فالخدمة تحمل [DisableAuditing].
        - إشعار للجهة المعالجة فقط. الإشعار عام تمامًا مثل «لديك تحديث جديد»، ولا يحتوي اسمًا أو موضوعًا أو مستوى.
        - لا يُبلَّغ المشتكى عليه بأي شكل.
        - تُرفع المرفقات بعد الإنشاء عبر مسار attachment.
        - الشكوى لا تُحذف. لا يوجد في هذا العقد أي مسار حذف أو تعديل للشكوى.
      x-source: ["5.8", "3"]
      x-release: 1
      x-allowed-roles: ["employee", "departmentManager"]
      x-permission: Hr.Complaints.Submit
      x-data-scope: self
      x-error-codes: ["Hr:Complaints:RespondentRequired", "Hr:Complaints:RespondentNotAllowed", "Hr:Complaints:SelfComplaintNotAllowed", "Hr:Complaints:NoEligibleHandler"]
      x-open-question: "لم توضح الوثيقة مسار الشكوى إذا كان مقدمها هو الجهة المعالجة نفسها، مثل مدير موارد بشرية يملك دور موظف ويشتكي على زميل. لا يُحال ذلك إلى المدير التنفيذي تلقائيًا لأنه لا يرى الشكاوى العادية. العقد يرد NoEligibleHandler حتى يُحسم المسار. ما المسار المطلوب؟"
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintCreateDto"
            example:
              targetKind: employee
              respondentId: b94d27c1-1f5e-4a8c-b6d3-0e7a2c4f8a03
              level: normal
              subject: "سلوك غير لائق في الاجتماع"
              content: "في اجتماع يوم الأحد تعرضت لكلام غير لائق أمام الزملاء، وأطلب معالجة الموضوع."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintSubmitResultDto"
              example:
                id: "3f2b8a54-6d1e-4c7a-9b10-2e5f7a1c9d01"
                referenceNumber: CMP-2026-00042
                level: confidential
                levelRaisedBySystem: true
                status: pendingHrManager
                submittedAt: "2026-11-04T08:15:00Z"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "./common.yaml#/components/responses/BusinessRuleViolation"
  /api/app/complaint/my:
    get:
      operationId: Complaint_GetMyList
      tags: ["Complaints"]
      summary: List my complaints
      description: "الشكاوى التي قدمها المستخدم فقط. لا تظهر فيها أبدًا الشكاوى المقدمة ضده. المستخدم الذي لم يقدم شكوى يحصل على قائمة فارغة."
      x-source: ["5.8", "3"]
      x-release: 1
      x-allowed-roles: ["employee", "departmentManager"]
      x-permission: Hr.Complaints.ViewOwn
      x-data-scope: self
      x-error-codes: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ComplaintStatus"
        - name: level
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ComplaintLevel"
        - $ref: "./common.yaml#/components/parameters/SkipCount"
        - $ref: "./common.yaml#/components/parameters/MaxResultCount"
        - $ref: "./common.yaml#/components/parameters/Sorting"
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintComplainantSummaryPagedResultDto"
              example:
                totalCount: 1
                items:
                  - id: "3f2b8a54-6d1e-4c7a-9b10-2e5f7a1c9d01"
                    referenceNumber: CMP-2026-00042
                    subject: "سلوك غير لائق في الاجتماع"
                    level: confidential
                    status: pendingHrManager
                    submittedAt: "2026-11-04T08:15:00Z"
                    closedAt: null
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
  /api/app/complaint/my/{id}:
    get:
      operationId: Complaint_GetMyDetail
      tags: ["Complaints"]
      summary: Get my complaint as complainant
      description: |-
        تفاصيل الشكوى لمقدمها، وكل قراءة تُسجل في سجل الاطلاع.
        عند فتح إشعار complaintUpdate، وهو رمز واحد لمقدم الشكوى والمعالج، يطلب التطبيق هذا المسار أولًا، فإذا رد 404 يطلب GET /api/app/complaint/{id}.
        يرد 404 وليس 403 لكل مستخدم غير مخول، بمن فيهم المشتكى عليه مهما كانت أدواره ومسؤول النظام حتى لو أضاف لنفسه دورًا آخر، حتى لا يُكشف وجود الشكوى. يفحص ComplaintAccessPolicy كل عملية.
      x-source: ["5.8"]
      x-release: 1
      x-allowed-roles: ["employee", "departmentManager"]
      x-permission: Hr.Complaints.ViewOwn
      x-data-scope: self
      x-error-codes: []
      x-added-route: "عرض مقدم الشكوى بـDTO منفصل لا يحتوي بيانات المعالجة الداخلية (5.8 وقواعد الخصوصية في CONVENTIONS)"
      x-open-question: "لم توضح الوثيقة هل يطلع مقدم الشكوى على الإجراءات الداخلية أو نص قرار الإغلاق. العقد يعرض له الحالة والمستوى وتاريخ الإغلاق فقط، ويخفي الإجراءات والقرار والمعالج. هل يُعرض له القرار عند الإغلاق؟"
      parameters:
        - $ref: "./common.yaml#/components/parameters/Id"
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintComplainantDetailDto"
              example:
                id: "3f2b8a54-6d1e-4c7a-9b10-2e5f7a1c9d01"
                referenceNumber: CMP-2026-00042
                targetKind: employee
                respondent:
                  id: b94d27c1-1f5e-4a8c-b6d3-0e7a2c4f8a03
                  fullName: "عمر ياسين"
                  departmentName: "قسم المبيعات"
                level: confidential
                status: pendingHrManager
                subject: "سلوك غير لائق في الاجتماع"
                content: "في اجتماع يوم الأحد تعرضت لكلام غير لائق أمام الزملاء، وأطلب معالجة الموضوع."
                attachments: []
                submittedAt: "2026-11-04T08:15:00Z"
                closedAt: null
                concurrencyStamp: "9f1c2e7ab04d4c5e8a6f3d21"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
  /api/app/complaint/assigned:
    get:
      operationId: Complaint_GetAssignedList
      tags: ["Complaints"]
      summary: List complaints assigned to me
      description: |-
        صندوق المعالج. يحددها ComplaintAccessPolicy وليس شاشة الصلاحيات وحدها:
        - مدير القسم: الشكاوى العادية المعلقة عنده فقط، ولا يرى السرية مطلقًا.
        - مدير الموارد البشرية: normal التي وصلته وconfidential.
        - المدير التنفيذي: highlyConfidential فقط، ولا يرى الشكاوى العادية حتى كأعداد.
        - صاحب تعيين معتمد في ComplaintHandlerAssignments: شكاوى مستوى تعيينه، أيًا كانت أدواره. عند اعتماد التعيين يمنحه الخادم هذه الصلاحية حتى تظهر الشاشة له، ويسحبها عند انتهائه.
        - التفويض العام (Delegation) لا يمنح أي وصول إلى الشكاوى.
        تُستثنى دائمًا الشكاوى التي يكون المستخدم طرفًا فيها. لا يُرد 403، والمستخدم غير المعالج يحصل على قائمة فارغة، حتى لا يُكشف شيء.

        سلوك التأخر (البند 5.8): تصبح الشكوى المفتوحة متأخرة عند تجاوز المهلة التي يحددها مسؤول النظام دون رؤية أي محتوى، عبر GET وPUT /api/app/system-settings/complaints في hr-finance-system.yaml (الحقلان delayDeadlineWorkingDays وoverdueReminderIntervalWorkingDays).

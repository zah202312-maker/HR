        - لا يتاح فتح أي شكوى من هذه اللوحة، ولا يملك المراجع أي مسار شكاوى كمعالج.
        - لا يملك المدير التنفيذي الوصول إلى هذه اللوحة، لأنه لا يرى الشكاوى العادية حتى كأعداد.
        جزء الأقسام يعرض الإنجاز والتأخر، ولا يُعد القسم منجزًا إلا برفع التقييم والتقرير معًا. تظهر علامة «متأخر» من يوم الدوام الرابع. يكتمل هذا الجزء في الإصدار 2 مع وحدة التقييم، وقبلها departments فارغة وcycleId = null.

        سلوك التأخر (البند 5.8): تصبح الشكوى المفتوحة متأخرة عند تجاوز المهلة التي يحددها مسؤول النظام دون رؤية أي محتوى، عبر GET وPUT /api/app/system-settings/complaints في hr-finance-system.yaml (الحقلان delayDeadlineWorkingDays وoverdueReminderIntervalWorkingDays).
        - normal وconfidential: تذكير لمدير الموارد البشرية، ويظهر عددها للمراجع.
        - highlyConfidential: تذكير للمدير التنفيذي، ويظهر عددها للمراجع دون تفاصيل.
        التأخر لا يغير المستوى ولا الجهة المعالجة، ولا يمنح متلقي التذكير حق الوصول إلى محتوى لا يملكه. الإشعار عام تمامًا مثل «لديك تحديث جديد»، ولا يحتوي اسمًا أو موضوعًا أو مستوى. لا يُرسل التذكير إلى طرف في الشكوى، أي مقدمها أو المشتكى عليه.

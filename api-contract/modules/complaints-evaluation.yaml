        توقيت الدورة الشهرية (البند 5.10)، وكل المهل تُعدل من /api/app/system-settings/reminders في hr-finance-system.yaml:

        | الموعد | الإجراء |
        |---|---|
        | آخر يوم دوام 10:00 | تُفتح النماذج، ويصل تنبيه موحد برابط مباشر وعدد المتبقي، ويجمع التقييم والتقرير في رسالة واحدة |
        | أول يوم دوام من الشهر التالي | تثبيت بيانات الشهر وتوليد التقرير |
        | أيام الدوام 1–3 | المهلة وتذكير يومي |
        | اليوم الرابع | تصعيد لمدير الموارد البشرية وعلامة «متأخر» في تقرير المراجع |

        لا يُعد القسم منجزًا إلا إذا رفع المدير كل التقييمات والتقرير معًا.

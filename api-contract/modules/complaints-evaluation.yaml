components:
  securitySchemes:
    oauth2:
      $ref: "./common.yaml#/components/securitySchemes/oauth2"
  schemas:
    ComplaintLevel:
      type: string
      description: "مستوى الشكوى. الترتيب من الأدنى إلى الأعلى: normal ثم confidential ثم highlyConfidential."
      enum: ["normal", "confidential", "highlyConfidential"]
    ComplaintStatus:
      type: string
      description: "حالة الشكوى. الحالات المفتوحة تحدد الجهة التي تقف عندها الشكوى."
      enum: ["pendingDepartmentManager", "pendingHrManager", "pendingExecutiveDirector", "closed"]
    ComplaintTargetKind:
      type: string
      description: "employee: ضد شخص محدد. general: شكوى عامة دون مشتكى عليه."
      enum: ["employee", "general"]
    ComplaintRespondentCategory:
      type: string
      description: "فئة المشتكى عليه كما يحددها الخادم. لا يراها إلا المعالج."
      enum: ["colleague", "departmentManager", "storeOfficer", "hrManager", "reviewer"]
    ComplaintHandlerRole:
      type: string
      description: "الجهة المعالجة في مسار الشكوى."
      enum: ["departmentManager", "hrManager", "executiveDirector"]
    ComplaintManualActionType:
      type: string
      description: "أنواع الإجراءات التي يضيفها المعالج يدويًا."
      enum: ["note", "meeting", "investigation", "followUp"]
    ComplaintActionType:
      type: string
      description: "كل أنواع سجل الإجراءات. submitted وlevelRaised وforwarded وclosed يولدها الخادم."
      enum: ["note", "meeting", "investigation", "followUp", "submitted", "levelRaised", "forwarded", "closed"]
    ComplaintAccessAction:
      type: string
      description: "نوع العملية في سجل الاطلاع."
      enum: ["viewDetail", "downloadAttachment", "uploadAttachment", "viewAccessLog", "addAction", "raiseLevel", "forward", "close"]
    ComplaintHandlerAssignmentStatus:
      type: string
      description: "حالة طلب تعيين معالج."
      enum: ["pendingApproval", "approved", "rejected", "revoked"]
    ComplaintRespondentPagedResultDto:
      type: object
      description: "قائمة المشتكى عليهم الممكنين. لا تحتوي دورًا أو فئة حتى لا تكشف الهيكل الداخلي للتوجيه."
      required: ["totalCount", "items"]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
    ComplaintRoutingPreviewInputDto:
      type: object
      required: ["targetKind"]
      properties:
        targetKind:
          $ref: "#/components/schemas/ComplaintTargetKind"
        respondentId:
          type: string
          format: uuid
          description: "مطلوب عندما تكون targetKind = employee، ويجب أن يكون null أو غائبًا عندما تكون general."
          nullable: true
    ComplaintRouteOptionDto:
      type: object
      description: "المسار الذي ستسلكه الشكوى إذا قُدمت بهذا المستوى."
      required: ["level", "handlerPath"]
      properties:
        level:
          $ref: "#/components/schemas/ComplaintLevel"
        handlerPath:
          type: array
          items:
            $ref: "#/components/schemas/ComplaintHandlerRole"
          description: "الجهات بالترتيب. الأدوار فقط، دون أسماء أشخاص."
    ComplaintRoutingPreviewDto:
      type: object
      required: ["minimumLevel", "selectableLevels", "routes"]
      properties:
        minimumLevel:
          allOf:
            - $ref: "#/components/schemas/ComplaintLevel"
          description: "أدنى مستوى تفرضه هوية المشتكى عليه."
        selectableLevels:
          type: array
          items:
            $ref: "#/components/schemas/ComplaintLevel"
          description: "المستويات التي تظهر للموظف، من minimumLevel فأعلى."
        routes:
          type: array
          items:
            $ref: "#/components/schemas/ComplaintRouteOptionDto"
          description: "عنصر واحد لكل مستوى في selectableLevels."
    ComplaintCreateDto:
      type: object
      required: ["targetKind", "level", "subject", "content"]
      properties:
        targetKind:
          $ref: "#/components/schemas/ComplaintTargetKind"
        respondentId:
          type: string
          format: uuid
          description: "مطلوب عندما تكون targetKind = employee، ويجب أن يكون null أو غائبًا عندما تكون general."
          nullable: true
        level:
          allOf:
            - $ref: "#/components/schemas/ComplaintLevel"
          description: "المستوى الذي يختاره الموظف. إذا كان أقل من الحد الأدنى يرفعه الخادم تلقائيًا."
        subject:
          type: string

      properties:
        fullNameAr:
          type: string
          minLength: 1
          maxLength: 200
        fullNameEn:
          type: string
          maxLength: 200
          nullable: true
        email:
          type: string
          description: "Also updates the account email."
          format: email
          nullable: true
        phoneNumber:
          type: string
          maxLength: 32
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          maxLength: 500
          nullable: true
        departmentId:
          type: string
          format: uuid
        jobTitle:
          type: string
          minLength: 1
          maxLength: 128
        hireDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        concurrencyStamp:
          type: string
          description: "Optimistic concurrency token. Send the latest value; a mismatch returns 409."
    ManagerChangeInputDto:
      type: object
      required: [managerEmployeeId, concurrencyStamp]
      properties:
        managerEmployeeId:
          type: string
          format: uuid
          description: "The new manager, as an employee id."

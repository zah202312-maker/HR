openapi: "3.0.3"
info:
  title: "HR System - Identity and Organization"
  version: "1.0.0"
  description: >-
    الدخول، المستخدم الحالي، الحسابات، الأدوار والصلاحيات، التحقق بخطوتين، الأقسام، الموظفون، ربط المديرين، الوثائق، والتفويض. x-permission بقيمة null تعني أن العملية تحتاج رمزًا صالحًا فقط دون صلاحية، حتى لا يمكن سحب حق أساسي مثل تغيير كلمة السر. x-data-scope يذكر أوسع نطاق، وx-data-scope-by-role يفصله عندما يختلف حسب الدور. x-release يتبع المرحلة في القسم 12: الأساس 1، ومسار الطلبات 2. ربط الموظف بدوام PUT /api/app/employee/{id}/shift في وحدة الدوام والإجازات.
servers:
  - url: https://api.hr.example.com
    description: "Placeholder. The real host is chosen at deployment."
x-global-rules:
  access-gates:
    description: >-
      حاجز وصول يفرضه الخادم على كل عمليات النظام في كل الوحدات، بما فيها ما ليس في هذا الملف، ويعتمد على حالة الحساب في الخادم في كل طلب وليس على محتوى الرمز. يصل المنع برد 403 بصيغة RemoteServiceErrorResponse ويكون error.code أحد الرمزين التاليين، فعلى عميل Flutter معالجته مركزيًا في Dio والانتقال إلى الشاشة الإجبارية. الرد 403 مقصود وليس 422، لأنه منع عام يسبق قواعد العملية، وكل عملية تعلن 403 أصلًا.
    codes:
      Hr:Identity:PasswordChangeRequired:
        when: "accessGate = passwordChangeRequired"
        allowedOperations: [OpenIdConfiguration_Get, ConnectToken_Issue, ApplicationConfiguration_Get, Me_Get, Account_ChangePassword]
      Hr:Identity:MfaEnrollmentRequired:
        when: "accessGate = mfaEnrollmentRequired"
        allowedOperations:
          - OpenIdConfiguration_Get
          - ConnectToken_Issue
          - ApplicationConfiguration_Get
          - Me_Get
          - Account_ChangePassword
          - Mfa_GetStatus
          - Mfa_StartEnrollment
          - Mfa_ConfirmEnrollment
    detection: "يقرأ العميل accessGate من extraProperties في application-configuration عند التشغيل أو من GET /api/app/me. إذا كانت none تعمل كل العمليات حسب الصلاحيات."
    exemptOperations: "مسار استقبال البصمة POST /api/attendance-devices/punches لا يخضع للحاجز، لأنه يعمل بمفتاح جهاز وليس بمستخدم."
  manager-link:
    description: >-
      من يصلح مديرًا لكل موظف. تُطبق الصفوف بالترتيب، وأول صف ينطبق على أدوار الموظف هو المعتمد. مخالفتها تعطي Hr:Employee:InvalidManagerForRole. وهي مأخوذة من مصفوفة الموافقات في القسم 4 لأن المسارات تعتمد على هذا الربط. يجب أن يكون المدير بحالة active، ولا يجوز أن يدير الشخص نفسه أو أن تتكون حلقة.
    rules:
      - employeeHasRole: executiveDirector
        managerMustHoldRole: null
        note: "لا مدير له. وأي رابط يُرفض بـHr:Employee:ExecutiveCannotHaveManager."
      - employeeHasRole: hrManager
        managerMustHoldRole: executiveDirector
      - employeeHasRole: systemAdmin
        managerMustHoldRole: executiveDirector
      - employeeHasRole: departmentManager
        managerMustHoldRole: systemAdmin
        note: "مسؤول النظام هو المدير الأعلى لمديري الأقسام."
      - employeeHasRole: anyOther
        managerMustHoldRole: departmentManager
        note: "موظفو الموارد البشرية يرتبطون بمديرها إذا حمل دور departmentManager أيضًا."
  error-codes-meaning:
    Hr:Identity:SingletonRoleAlreadyAssigned: "hrManager or executiveDirector already belongs to another active user."
    Hr:Identity:ProtectedPermissionNotGrantable: "A permission starting with Hr.Complaint was sent."
    Hr:Identity:FinancialPermissionNotGrantable: "A permission starting with Hr.Finance was granted to the departmentManager or storeOfficer role, or directly to a user holding either role."
    Hr:Employee:ManagerRequired: "A non-executive employee has no manager in the input."
    Hr:Employee:WorkShiftRequired: "A non-executive employee has no workShiftId in the input."
    Hr:Employee:EmployeeEnded: "The operation is not valid for an employee with status ended."
    Hr:Employee:HireDateLocked: "hireDate cannot change after leave ledger entries exist."
    Hr:Document:NotAvailable: "The document is not clean yet (pending or infected)."
security:
  - oauth2: [HR_Mangment2]
tags:
  - name: Auth
    description: >-
      الدخول وإعدادات التطبيق
  - name: CurrentUser
    description: >-
      المستخدم الحالي
  - name: Mfa
    description: >-
      التحقق بخطوتين
  - name: UserAccounts
    description: >-
      حسابات المستخدمين
  - name: RolesPermissions
    description: >-
      الأدوار والصلاحيات العادية
  - name: Departments
    description: >-
      الأقسام
  - name: Employees
    description: >-
      الموظفون وربط المديرين
  - name: EmployeeDocuments
    description: >-
      وثائق الموظف
  - name: Delegations
    description: >-
      التفويض
paths:
  /.well-known/openid-configuration:
    get:
      operationId: OpenIdConfiguration_Get
      tags: [Auth]
      summary: "Get the OpenID Connect discovery document"
      description: >-
        يوفره OpenIddict. يقرأ منه التطبيق عناوين الدخول والرموز. الدخول بطريقة Authorization Code + PKCE عبر صفحة دخول الخادم باللغتين، وFlutter عميل عام بلا Client Secret. لا يُرسل العميل معرّف شركة، فالشركة الوحيدة المفعلة يحددها الخادم.
      x-source: ["1", "7", "10"]
      x-release: 1
      x-allowed-roles: []
      x-permission: null
      x-data-scope: public
      x-error-codes: []
      security: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIdConfigurationDto"
              example:
                issuer: https://auth.hr.example.com/
                authorization_endpoint: https://auth.hr.example.com/connect/authorize
                token_endpoint: https://auth.hr.example.com/connect/token
                end_session_endpoint: https://auth.hr.example.com/connect/logout
                userinfo_endpoint: https://auth.hr.example.com/connect/userinfo
                revocation_endpoint: https://auth.hr.example.com/connect/revocat
                jwks_uri: https://auth.hr.example.com/.well-known/jwks
                scopes_supported: [openid, profile, offline_access, HR_Mangment2]
                response_types_supported: [code]
                grant_types_supported: [authorization_code, refresh_token]
                code_challenge_methods_supported: [S256]
  /connect/token:
    post:
      operationId: ConnectToken_Issue
      tags: [Auth]
      summary: "Issue or refresh tokens"
      description: >-
        يبادل رمز التفويض مع code_verifier برموز الدخول، أو يجدد الرموز برمز التجديد. لا يُدعم الدخول المباشر بكلمة السر من التطبيق، وأي كلمة سر أو رمز TOTP يُدخل في صفحة الدخول على الخادم فقط. يصدر الرمز حتى لو كان تغيير كلمة السر أو تفعيل التحقق بخطوتين مطلوبًا، ويتولى حاجز الوصول منع بقية العمليات. أخطاء هذا المسار بصيغة OAuth 2.0 وليست بصيغة ABP. على Flutter Web يُحفظ الرمز في الذاكرة، وقد يُستبدل هذا الاستدعاء بـBFF إذا أثبت الاختبار الحاجة إليه.
      x-source: ["1", "3", "7", "8", "10"]
      x-release: 1
      x-allowed-roles: []
      x-permission: null
      x-data-scope: public
      x-error-codes: []
      security: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ConnectTokenRequestDto"
            example:
              grant_type: authorization_code
              client_id: HR_Mangment2_Flutter
              code: Q3a9dZk1mN
              redirect_uri: com.example.hr://callback
              code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      responses:
        "200":
          description: "Tokens issued."
          headers:
            Cache-Control:
              description: "Always no-store, because the body holds a one-time secret."
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectTokenResponseDto"
              example:
                access_token: eyJhbGciOiJSUzI1NiJ9.example.signature
                token_type: Bearer
                expires_in: 3600
                refresh_token: CfDJ8Example
                id_token: eyJhbGciOiJSUzI1NiJ9.example.idtoken
                scope: "openid profile offline_access HR_Mangment2"
        "400":
          description: "OAuth 2.0 error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectTokenErrorDto"
              example:
                error: invalid_grant
                error_description: "The refresh token is no longer valid."
  /api/abp/application-configuration:
    get:
      operationId: ApplicationConfiguration_Get
      tags: [Auth]
      summary: "Get user, permissions, localization and settings"
      description: >-
        أول استدعاء بعد الدخول وعند كل تشغيل. تعتمد الواجهة على grantedPolicies لإخفاء ما لا يخص المستخدم، ويبقى الفحص الحقيقي في الخادم. يعيد extraProperties.accessGate حالة حاجز الوصول، فإذا لم تكن none ينتقل العميل مباشرة إلى شاشة تغيير كلمة السر أو تفعيل التحقق بخطوتين. يُعاد الاستدعاء بعد تغيير كلمة السر وتفعيل التحقق وتغيير اللغة وتغيير الأدوار. يعمل دون رمز ويعيد عندها isAuthenticated=false. يُستثنى من حاجز الوصول.
      x-source: ["3", "7", "8", "10"]
      x-release: 1
      x-allowed-roles: [employee, departmentManager, hrManager, executiveDirector, reviewer, accountant, storeOfficer, systemAdmin]
      x-permission: null
      x-data-scope: self
      x-error-codes: []
      security:
        - {}
        - oauth2: [HR_Mangment2]
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
        - name: includeLocalizationResources
          in: query
          required: false
          description: "Flutter sends false, because its UI labels come from ARB files."
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfigurationDto"
              example:
                localization:
                  currentCulture:
                    cultureName: ar
                    name: ar
                    displayName: "العربية"
                    twoLetterIsoLanguageName: ar
                    isRightToLeft: true
                  defaultResourceName: Hr
                  languages:
                    - cultureName: ar
                      uiCultureName: ar
                      displayName: "العربية"
                    - cultureName: en
                      uiCultureName: en
                      displayName: English
                  values: {}
                auth:
                  grantedPolicies:
                    Hr.Request.Create: true
                    Hr.Employee.ReadTeam: true
                setting:
                  values:
                    Abp.Localization.DefaultLanguage: ar
                    Abp.Identity.Password.RequiredLength: "8"
                    Hr.Document.MaxFileSizeBytes: "10485760"
                currentUser:
                  isAuthenticated: true
                  id: "5b2e8f41-93c7-4d0a-a6f2-7c1d9e4b3a44"
                  tenantId: null
                  userName: maryam.khaled
                  name: "مريم"
                  surName: "العلي"
                  email: "maryam.khaled@example.com"
                  emailVerified: false
                  phoneNumber: null
                  phoneNumberVerified: false
                  roles: [employee]
                extraProperties:
                  accessGate: passwordChangeRequired
                  mustChangePassword: true
                  mfaRequired: false
                  mfaEnabled: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
  /api/app/me:
    get:
      operationId: Me_Get
      tags: [CurrentUser]
      summary: "Get my account and access gate"
      description: >-
        يعيد بيانات حسابي وأدواري وحالة حاجز الوصول. بعد الدخول يرى المستخدم حسابه وخياراته حسب صلاحياته. يُستثنى من حاجز الوصول، وهو المرجع الذي يعتمده العميل لمعرفة الخطوة الإجبارية التالية.
      x-source: ["3", "8"]
      x-release: 1
      x-allowed-roles: [employee, departmentManager, hrManager, executiveDirector, reviewer, accountant, storeOfficer, systemAdmin]
      x-permission: null
      x-data-scope: self
      x-error-codes: []
      x-added-route: "كشف تغيير كلمة السر الإجباري وحالة التحقق بخطوتين للمستخدم الحالي (القسم 3)."
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountDto"
              example:
                userId: "5b2e8f41-93c7-4d0a-a6f2-7c1d9e4b3a44"
                userName: maryam.khaled
                displayName: "مريم خالد العلي"
                email: "maryam.khaled@example.com"
                preferredLanguage: ar
                roleNames: [employee]
                employee:
                  id: "3f0c1b52-7a44-4c1e-9a10-6d2f8e1a0b11"
                  fullName: "مريم خالد العلي"
                  departmentName: "قسم المبيعات"
                directReportCount: 0
                accessGate: passwordChangeRequired
                mustChangePassword: true
                mfaRequired: false
                mfaEnabled: false
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    patch:
      operationId: Me_Update
      tags: [CurrentUser]
      summary: "Update my preferred language"
      description: >-
        يحفظ لغة المستخدم، وتُرسل إليه الإشعارات بها. يعيد العميل طلب application-configuration بعد التغيير. يبقى ترويس Accept-Language هو ما يحدد لغة كل استجابة.
      x-source: ["1", "5.17", "8"]
      x-release: 1
      x-allowed-roles: [employee, departmentManager, hrManager, executiveDirector, reviewer, accountant, storeOfficer, systemAdmin]
      x-permission: null
      x-data-scope: self
      x-error-codes: []
      x-added-route: "حفظ لغة المستلم لإرسال الإشعارات بها (القسم 5.17) وشاشة اللغة (القسم 8)."
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyAccountUpdateDto"
            example:
              preferredLanguage: en
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountDto"
              example:
                userId: "5b2e8f41-93c7-4d0a-a6f2-7c1d9e4b3a44"
                userName: maryam.khaled
                displayName: "مريم خالد العلي"
                email: "maryam.khaled@example.com"
                preferredLanguage: en
                roleNames: [employee]
                employee:
                  id: "3f0c1b52-7a44-4c1e-9a10-6d2f8e1a0b11"
                  fullName: "مريم خالد العلي"
                  departmentName: "قسم المبيعات"
                directReportCount: 0
                accessGate: none
                mustChangePassword: false
                mfaRequired: false
                mfaEnabled: false
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
  /api/app/me/employee-profile:
    get:
      operationId: Me_GetEmployeeProfile
      tags: [CurrentUser]
      summary: "Get my own employee file"
      description: >-
        شاشة «ملفي». للقراءة فقط، فالتعديل عند الموارد البشرية. سجلات الملف الأخرى تأتي من وحداتها: حضوري، الأرصدة، طلباتي، المطالعات، التقييم، كتب الشكر، الإنذارات، العقود. الوثائق من GET /api/app/employee/{id}/documents.
      x-source: ["3", "5.1", "8"]
      x-release: 1
      x-allowed-roles: [employee, departmentManager, hrManager, executiveDirector, reviewer, accountant, storeOfficer, systemAdmin]
      x-permission: Hr.Employee.ReadSelf
      x-data-scope: self
      x-error-codes: []
      x-added-route: "عرض الملف للموظف نفسه بنموذج مستقل، لأن DTO يختلف حسب الجمهور (القسم 5.1 وقواعد الخصوصية)."
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeSelfDto"
              example:
                id: "3f0c1b52-7a44-4c1e-9a10-6d2f8e1a0b11"
                fullName: "مريم خالد العلي"
                fullNameAr: "مريم خالد العلي"
                fullNameEn: "Maryam Khaled Al-Ali"
                email: "maryam.khaled@example.com"
                phoneNumber: "+9647700000000"
                dateOfBirth: "1994-07-02"
                address: "بغداد، حي المنصور"
                department:
                  id: e19a6c33-58d2-47b1-9f30-2a4c7b8d1e55
                  name: "قسم المبيعات"
                jobTitle: "أخصائية مبيعات"
                hireDate: "2026-03-15"
                status: active
                manager:
                  id: "8a7d2c10-41b6-4f55-8e23-1c9b7d6e2f22"
                  fullName: "يوسف سالم الحداد"
                  departmentName: "قسم المبيعات"
                currentShift:
                  workShiftId: "2d7f4a18-c06e-4b93-8d51-9e3a6c2f0d66"
                  name: "الدوام الصباحي"
                  effectiveFrom: "2026-03-15"
                currentContract:
                  contractId: b8e24d16-37fa-4901-9c5d-0a6f2e7b1caa
                  startDate: "2026-03-15"

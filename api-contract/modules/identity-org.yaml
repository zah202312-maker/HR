          type: boolean
        mfaRequired:
          type: boolean
        mfaEnabled:
          type: boolean
        roleNames:
          type: array
          items:
            type: string
    EmployeeHrDto:
      type: object
      description: "Full employee file for the HR manager. Salary data stays in the finance module and complaints stay in the complaints module, since both are isolated at service and database level."
      required:
        - id
        - fullName
        - fullNameAr
        - department
        - jobTitle
        - hireDate
        - status
        - directReportCount
        - creationTime
        - concurrencyStamp
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          description: "Localized by Accept-Language."
        fullNameAr:
          type: string
        fullNameEn:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        department:
          $ref: "./common.yaml#/components/schemas/DepartmentRefDto"
        jobTitle:
          type: string
        hireDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        manager:
          description: "Null only for the executive director."
          allOf:
            - $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
          nullable: true
        currentShift:
          allOf:
            - $ref: "#/components/schemas/EmployeeShiftSummaryDto"
          nullable: true
        currentContract:
          allOf:
            - $ref: "#/components/schemas/EmployeeContractSummaryDto"
          nullable: true
        account:
          description: "Null when the employee has no account yet."
          allOf:
            - $ref: "#/components/schemas/EmployeeAccountSummaryDto"
          nullable: true
        directReportCount:
          type: integer
          format: int32
          minimum: 0
        creationTime:
          type: string
          format: date-time
        lastModificationTime:
          type: string
          format: date-time
          nullable: true
        concurrencyStamp:
          type: string
          description: "Optimistic concurrency token. Send the latest value; a mismatch returns 409."
    EmployeeListItemDto:
      type: object
      required: [id, fullName, department, jobTitle, hireDate, status, roleNames, hasAccount]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          description: "Localized by Accept-Language."
        department:
          $ref: "./common.yaml#/components/schemas/DepartmentRefDto"
        jobTitle:
          type: string
        hireDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        manager:
          allOf:
            - $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
          nullable: true
        roleNames:
          type: array
          items:
            type: string
        hasAccount:
          type: boolean
    EmployeeListItemPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeListItemDto"
    EmployeeLookupPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
    EmployeeCreateDto:
      type: object
      required: [fullNameAr, departmentId, jobTitle, hireDate, userName, roleNames]
      properties:
        fullNameAr:
          type: string
          minLength: 1
          maxLength: 200
        fullNameEn:
          type: string
          maxLength: 200
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phoneNumber:
          type: string
          maxLength: 32
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          maxLength: 500
          nullable: true
        departmentId:
          type: string
          format: uuid
        jobTitle:
          type: string
          minLength: 1
          maxLength: 128
        hireDate:
          type: string
          format: date
        workShiftId:
          type: string
          format: uuid
          description: "Required for everyone except the executive director. Takes effect from hireDate."
          nullable: true
        managerEmployeeId:
          type: string
          format: uuid
          description: "Required, and must follow x-global-rules.manager-link. Must be null for the executive director."
          nullable: true
        userName:
          type: string
          description: "Account user name."
          minLength: 3
          maxLength: 64
        roleNames:
          type: array
          description: "Role names, one or more. The server always adds employee."
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 64
    EmployeeCreatedDto:
      type: object
      required: [employee, credentials]
      properties:
        employee:
          $ref: "#/components/schemas/EmployeeHrDto"

        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - code_challenge_methods_supported
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        end_session_endpoint:
          type: string
          format: uri
          nullable: true
        userinfo_endpoint:
          type: string
          format: uri
          nullable: true
        revocation_endpoint:
          type: string
          format: uri
          nullable: true
        jwks_uri:
          type: string
          format: uri
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
    ConnectTokenRequestDto:
      type: object
      description: "Form body of POST /connect/token. Property names are snake_case as fixed by OAuth 2.0."
      required: [grant_type, client_id]
      properties:
        grant_type:
          type: string
          description: "The password grant is not supported."
          enum: [authorization_code, refresh_token]
        client_id:
          type: string
          description: "Public client id of the Flutter app. No client secret exists."
        code:
          type: string
          description: "Required when grant_type is authorization_code."
          nullable: true
        redirect_uri:
          type: string
          description: "Required when grant_type is authorization_code. Must equal the value sent to /connect/authorize."
          format: uri
          nullable: true
        code_verifier:
          type: string
          description: "PKCE verifier. Required when grant_type is authorization_code."
          nullable: true
        refresh_token:
          type: string
          description: "Required when grant_type is refresh_token."
          nullable: true
        scope:
          type: string
          description: "Space separated scopes, for example: openid profile offline_access HR_Mangment2."
          nullable: true
    ConnectTokenResponseDto:
      type: object
      description: "OAuth 2.0 token response. Property names are snake_case as fixed by the standard."
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int32
          description: "Access token lifetime in seconds."
        refresh_token:
          type: string
          description: "Present when the offline_access scope was granted."
          nullable: true
        id_token:
          type: string
          description: "Present when the openid scope was granted."
          nullable: true
        scope:
          type: string
          nullable: true
    ConnectTokenErrorDto:
      type: object
      description: "OAuth 2.0 error body. /connect/token is the only route in this module that does not use RemoteServiceErrorResponse."
      required: [error]
      properties:
        error:
          type: string
          description: "OAuth 2.0 error code. A suspended or ended account gets invalid_grant."
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope]
        error_description:
          type: string
          nullable: true
    ApplicationConfigurationDto:
      type: object
      description: "The fields of the ABP application configuration that the Flutter app relies on. ABP may return other fields; they are not part of this contract and the client must ignore them."
      required: [localization, auth, setting, currentUser]
      properties:
        localization:
          $ref: "#/components/schemas/AppConfigLocalizationDto"
        auth:
          $ref: "#/components/schemas/AppConfigAuthDto"
        setting:
          $ref: "#/components/schemas/AppConfigSettingDto"
        currentUser:
          $ref: "#/components/schemas/AppConfigCurrentUserDto"
        extraProperties:
          description: "Added by a backend IApplicationConfigurationContributor. Null for anonymous calls."
          allOf:
            - $ref: "#/components/schemas/AppConfigExtraPropertiesDto"
          nullable: true
    AppConfigLocalizationDto:
      type: object
      required: [currentCulture, languages, values]
      properties:
        currentCulture:
          $ref: "#/components/schemas/AppConfigCurrentCultureDto"
        defaultResourceName:
          type: string
          nullable: true
        languages:
          type: array
          description: "Exactly ar and en. ar is the default."
          items:
            $ref: "#/components/schemas/AppConfigLanguageDto"
        values:
          type: object
          description: "Backend localization texts: resource name, then key, then text. The Flutter UI uses its own ARB files for labels."
          additionalProperties:
            type: object
            additionalProperties:
              type: string
    AppConfigCurrentCultureDto:
      type: object
      required: [cultureName, name, displayName, twoLetterIsoLanguageName, isRightToLeft]
      properties:
        cultureName:
          type: string
          example: ar
        name:
          type: string
          example: ar
        displayName:
          type: string
        twoLetterIsoLanguageName:
          type: string
          example: ar
        isRightToLeft:
          type: boolean
          description: "Drives the screen direction."
    AppConfigLanguageDto:
      type: object
      required: [cultureName, uiCultureName, displayName]
      properties:
        cultureName:
          type: string
        uiCultureName:
          type: string
        displayName:
          type: string
    AppConfigAuthDto:
      type: object
      required: [grantedPolicies]
      properties:
        grantedPolicies:
          type: object
          description: "Permission names granted to the current user (union of all roles and direct grants). Only granted names appear, each with the value true. Used to hide UI; the server still checks every call."
          additionalProperties:
            type: boolean
    AppConfigSettingDto:
      type: object
      required: [values]
      properties:
        values:
          type: object
          description: "Settings visible to this client. Never contains secrets. The backend must expose Abp.Localization.DefaultLanguage and the Abp.Identity.Password.* rules (RequiredLength, RequiredUniqueChars, RequireNonAlphanumeric, RequireLowercase, RequireUppercase, RequireDigit), and Hr.Document.MaxFileSizeBytes and Hr.Document.AllowedContentTypes."
          additionalProperties:
            type: string
            nullable: true
    AppConfigCurrentUserDto:
      type: object
      required: [isAuthenticated, roles]
      properties:
        isAuthenticated:
          type: boolean
        id:
          type: string
          format: uuid
          description: "User id. Null when anonymous."
          nullable: true
        tenantId:
          type: string
          format: uuid
          nullable: true
        userName:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        surName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        phoneNumber:
          type: string
          nullable: true
        phoneNumberVerified:
          type: boolean
        roles:
          type: array
          description: "Role names. Built-in roles use AppRole values. A user may hold several, and permissions are their union."
          items:
            type: string
    AppConfigExtraPropertiesDto:
      type: object
      description: "Same values as MyAccountDto, so the client can route on startup with one call."
      required: [accessGate, mustChangePassword, mfaRequired, mfaEnabled]
      properties:
        accessGate:
          $ref: "#/components/schemas/AccessGate"
        mustChangePassword:
          type: boolean
        mfaRequired:
          type: boolean
        mfaEnabled:
          type: boolean
    AccessGate:
      type: string
      description: "What the user must finish before using the system. passwordChangeRequired is evaluated first. Any value other than none blocks other operations with 403; see x-global-rules.access-gates."
      enum: [none, passwordChangeRequired, mfaEnrollmentRequired]
    AppLanguage:
      type: string
      enum: [ar, en]
    MyAccountDto:
      type: object
      required:
        - userId
        - userName
        - displayName
        - preferredLanguage
        - roleNames
        - directReportCount
        - accessGate
        - mustChangePassword
        - mfaRequired
        - mfaEnabled
      properties:
        userId:
          type: string
          format: uuid
        userName:
          type: string
        displayName:
          type: string
        email:
          type: string
          nullable: true
        preferredLanguage:
          $ref: "#/components/schemas/AppLanguage"
        roleNames:
          type: array
          items:
            type: string
        employee:
          description: "Null only for a technical account that has no employee file."
          allOf:
            - $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
          nullable: true
        directReportCount:
          type: integer
          format: int32
          description: "Employees currently linked to this user as their manager."
          minimum: 0
        accessGate:
          $ref: "#/components/schemas/AccessGate"
        mustChangePassword:
          type: boolean
        mfaRequired:
          type: boolean
          description: "True when the user holds hrManager, executiveDirector, accountant or systemAdmin."
        mfaEnabled:
          type: boolean
    MyAccountUpdateDto:
      type: object
      required: [preferredLanguage]
      properties:
        preferredLanguage:
          $ref: "#/components/schemas/AppLanguage"
    ChangePasswordInputDto:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          description: "The current or temporary password."
          minLength: 1
          maxLength: 128
          format: password
        newPassword:
          type: string
          description: "Must satisfy the Abp.Identity.Password.* settings."
          minLength: 1
          maxLength: 128
          format: password
    ChangePasswordResultDto:
      type: object
      description: "accessGate tells the client the next step, for example mfaEnrollmentRequired."
      required: [accessGate, changedAt]
      properties:
        accessGate:
          $ref: "#/components/schemas/AccessGate"
        changedAt:
          type: string
          format: date-time
    InboxCategory:
      type: string
      description: "Kind of pending item. Complaints are deliberately not a category."
      enum:
        - request
        - memo
        - incident
        - stockIssue
        - evaluation
        - departmentReport
        - evaluationObjection
        - evaluationAcknowledgement
        - circularAcknowledgement
        - custodyAcknowledgement
        - warningResponse
        - warningDecision
        - contractDecision
        - appreciationLetterAcknowledgement
    InboxSummaryItemDto:
      type: object
      required: [category, count, delegatedCount]
      properties:
        category:
          $ref: "#/components/schemas/InboxCategory"
        count:
          type: integer
          format: int32
          description: "All pending items in this category, including delegated ones."
          minimum: 1
        delegatedCount:
          type: integer
          format: int32
          description: "The part of count that reached this user through an active delegation."
          minimum: 0
    InboxSummaryDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int32
          minimum: 0
        items:
          type: array
          description: "Only categories with a count above zero."
          items:
            $ref: "#/components/schemas/InboxSummaryItemDto"
    AdministrativeTaskType:
      type: string
      enum:
        - requestApproved
        - requestRejected
        - requestSubmittedOnBehalf
        - memoProcessed
        - incidentForwarded
        - evaluationSubmitted
        - departmentReportSubmitted
        - circularSent
        - custodyCountRecorded
        - warningRecommended
        - delegationCreated
    AdministrativeTaskLogEntryDto:
      type: object
      description: "One administrative task done by a manager. Complaint work never appears here."
      required: [occurredAt, taskType, title]
      properties:
        occurredAt:
          type: string
          format: date-time
        taskType:
          $ref: "#/components/schemas/AdministrativeTaskType"
        title:
          type: string
          description: "Localized by Accept-Language."
        referenceId:
          type: string
          format: uuid
          description: "Id of the related record; its kind follows from taskType."
          nullable: true
    AdministrativeTaskLogPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdministrativeTaskLogEntryDto"
    MfaStatusDto:
      type: object
      required: [isRequired, isEnabled, recoveryCodesRemaining]
      properties:
        isRequired:
          type: boolean
        isEnabled:
          type: boolean
        enabledAt:
          type: string
          format: date-time
          nullable: true
        recoveryCodesRemaining:
          type: integer
          format: int32
          minimum: 0
    MfaEnrollmentDto:
      type: object
      required: [sharedKey, authenticatorUri]
      properties:
        sharedKey:
          type: string
          description: "TOTP secret in Base32, for manual entry. Returned only by this call."
        authenticatorUri:
          type: string
          description: "otpauth:// URI to render as a QR code."
    MfaCodeInputDto:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: "Six-digit TOTP code."
          pattern: "^[0-9]{6}$"
    MfaRecoveryCodesDto:
      type: object
      required: [recoveryCodes, accessGate]
      properties:
        recoveryCodes:
          type: array
          description: "Shown once only. Each code works one time at sign-in."
          items:
            type: string
        accessGate:
          $ref: "#/components/schemas/AccessGate"
    UserAccountDto:
      type: object
      description: "Account as seen by HR and the system admin. No password value or hash exists in any DTO."
      required:
        - id
        - userName
        - isActive
        - isLockedOut
        - mustChangePassword
        - mfaRequired
        - mfaEnabled
        - roleNames
        - creationTime
        - concurrencyStamp
      properties:
        id:
          type: string
          format: uuid
          description: "User id, not employee id."
        userName:
          type: string
        email:
          type: string
          nullable: true
        employee:
          description: "Null only for a technical account that has no employee file."
          allOf:
            - $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
          nullable: true
        isActive:
          type: boolean
          description: "False while the employee is suspended or ended."
        isLockedOut:
          type: boolean
          description: "Temporary sign-in lockout. Cleared by a password reset."
        mustChangePassword:
          type: boolean
        mfaRequired:
          type: boolean
        mfaEnabled:
          type: boolean
        roleNames:
          type: array
          items:
            type: string
        creationTime:
          type: string
          format: date-time
        lastModificationTime:
          type: string
          format: date-time
          nullable: true
        concurrencyStamp:
          type: string
          description: "Optimistic concurrency token. Send the latest value; a mismatch returns 409."
    UserAccountPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserAccountDto"
    UserAccountCreateDto:
      type: object
      required: [employeeId, userName, roleNames]
      properties:
        employeeId:
          type: string
          format: uuid
          description: "An employee that has no account yet."
        userName:
          type: string
          minLength: 3
          maxLength: 64
        email:
          type: string
          description: "Defaults to the email on the employee file."
          format: email
          nullable: true
        roleNames:
          type: array
          description: "Role names. The server always adds employee."
          items:
            type: string
            minLength: 1
            maxLength: 64
    TemporaryCredentialsDto:
      type: object
      required: [userId, userName, temporaryPassword, mustChangePassword]
      properties:
        userId:
          type: string
          format: uuid
        userName:
          type: string
        temporaryPassword:
          type: string
          description: "Generated by the server and returned only in this response. It cannot be read again by anyone; a lost value requires a reset."
        mustChangePassword:
          type: boolean
          description: "Always true."
    UserAccountCreatedDto:
      type: object
      required: [account, credentials]
      properties:
        account:
          $ref: "#/components/schemas/UserAccountDto"
        credentials:
          $ref: "#/components/schemas/TemporaryCredentialsDto"
    UserRolesUpdateDto:
      type: object
      required: [roleNames, concurrencyStamp]
      properties:
        roleNames:
          type: array
          description: "The complete new set of roles. The server always keeps employee on accounts linked to an employee file."
          items:
            type: string
            minLength: 1
            maxLength: 64
        managerEmployeeId:
          type: string
          format: uuid
          description: "Needed only when the new roles make the current manager link invalid. Applied in the same transaction with the effects of a manager change."
          nullable: true
        concurrencyStamp:
          type: string
          description: "Optimistic concurrency token. Send the latest value; a mismatch returns 409."
    RoleDto:
      type: object
      required: [id, name, displayName, nameAr, nameEn, isStatic, userCount, concurrencyStamp]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: "Stable role identifier, used in roleNames and in currentUser.roles. Built-in roles use AppRole values."
        displayName:
          type: string
          description: "Localized by Accept-Language."
        nameAr:
          type: string
        nameEn:
          type: string
        isStatic:
          type: boolean
          description: "True for the eight built-in roles. They cannot be deleted, and their name never changes."
        userCount:
          type: integer
          format: int32
          minimum: 0
        concurrencyStamp:
          type: string
          description: "Optimistic concurrency token. Send the latest value; a mismatch returns 409."
    RolePagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleDto"
    RoleCreateDto:
      type: object
      required: [name, nameAr, nameEn]
      properties:
        name:
          type: string
          description: "Unique identifier in camelCase. Must not equal an AppRole value."
          pattern: "^[a-z][a-zA-Z0-9]{1,63}$"
        nameAr:
          type: string
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          minLength: 1
          maxLength: 128
    RoleUpdateDto:
      type: object
      required: [nameAr, nameEn, concurrencyStamp]
      properties:
        nameAr:
          type: string
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          minLength: 1
          maxLength: 128
        concurrencyStamp:
          type: string
          description: "Optimistic concurrency token. Send the latest value; a mismatch returns 409."
    PermissionGrantInfoDto:
      type: object
      required: [name, displayName, isGranted, isDirectlyGranted, grantedByRoleNames]
      properties:
        name:
          type: string
          description: "ABP permission name."
        displayName:
          type: string
          description: "Localized by Accept-Language."
        parentName:
          type: string
          nullable: true
        isGranted:
          type: boolean
          description: "Effective value for this role or user."
        isDirectlyGranted:
          type: boolean
          description: "Granted on this exact role or user, not inherited. Only this part can be changed here."
        grantedByRoleNames:
          type: array
          description: "Roles that provide this permission. Always empty when reading a role."
          items:
            type: string
    PermissionGroupDto:
      type: object
      required: [name, displayName, permissions]
      properties:
        name:
          type: string
        displayName:
          type: string
          description: "Localized by Accept-Language."
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionGrantInfoDto"
    PermissionListResultDto:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          description: "Ordinary permissions only. Names starting with Hr.Complaint are absent."
          items:
            $ref: "#/components/schemas/PermissionGroupDto"
    PermissionGrantChangeDto:
      type: object
      required: [name, isGranted]
      properties:
        name:
          type: string
        isGranted:
          type: boolean
    PermissionGrantUpdateDto:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: "Only the permissions to change. Others stay as they are."
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/PermissionGrantChangeDto"
    DepartmentDto:
      type: object
      description: "Admin read of a department, for HR. Other roles use DepartmentRefDto through the lookup."
      required: [id, name, nameAr, nameEn, employeeCount, creationTime, concurrencyStamp]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: "Localized by Accept-Language."
        nameAr:
          type: string
        nameEn:
          type: string
        employeeCount:
          type: integer
          format: int32
          description: "Employees with status active or suspended."
          minimum: 0
        creationTime:
          type: string
          format: date-time
        lastModificationTime:
          type: string
          format: date-time
          nullable: true
        concurrencyStamp:
          type: string
          description: "Optimistic concurrency token. Send the latest value; a mismatch returns 409."
    DepartmentPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentDto"
    DepartmentLookupPagedResultDto:
      type: object
      required: [totalCount, items]
      properties:
        totalCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/DepartmentRefDto"
    DepartmentCreateDto:
      type: object
      required: [nameAr, nameEn]
      properties:
        nameAr:
          type: string
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          minLength: 1
          maxLength: 128
    DepartmentUpdateDto:
      type: object
      required: [nameAr, nameEn, concurrencyStamp]
      properties:
        nameAr:
          type: string
          minLength: 1
          maxLength: 128
        nameEn:
          type: string
          minLength: 1
          maxLength: 128
        concurrencyStamp:
          type: string
          description: "Optimistic concurrency token. Send the latest value; a mismatch returns 409."
    EmployeeStatus:
      type: string
      enum: [active, suspended, ended]
    EmployeeShiftSummaryDto:
      type: object
      description: "The shift in force today. Shift changes use PUT /api/app/employee/{id}/shift in the time and leave module."
      required: [workShiftId, name, effectiveFrom]
      properties:
        workShiftId:
          type: string
          format: uuid
        name:
          type: string
          description: "Localized by Accept-Language."
        effectiveFrom:
          type: string
          format: date
    EmployeeContractSummaryDto:
      type: object
      required: [contractId, startDate]
      properties:
        contractId:
          type: string
          format: uuid
          description: "Details come from the contracts module."
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
    EmployeeSelfDto:
      type: object
      description: "The employee reading their own file."
      required: [id, fullName, fullNameAr, department, jobTitle, hireDate, status, roleNames]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          description: "Localized by Accept-Language."
        fullNameAr:
          type: string
        fullNameEn:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        department:
          $ref: "./common.yaml#/components/schemas/DepartmentRefDto"
        jobTitle:
          type: string
        hireDate:
          type: string
          format: date
          description: "Start of the personal leave year."
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        manager:
          description: "Null only for the executive director."
          allOf:
            - $ref: "./common.yaml#/components/schemas/EmployeeRefDto"
          nullable: true
        currentShift:
          description: "Null when attendance does not apply, as for the executive director."
          allOf:
            - $ref: "#/components/schemas/EmployeeShiftSummaryDto"
          nullable: true
        currentContract:
          allOf:
            - $ref: "#/components/schemas/EmployeeContractSummaryDto"
          nullable: true
        roleNames:
          type: array
          items:
            type: string
    EmployeeTeamMemberDto:
      type: object
      description: "Employee as seen by their direct manager. Financial data, complaints, contracts, birth date, address, roles and account data are absent by design. Do not add them."
      required: [id, fullName, department, jobTitle, hireDate, status]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          description: "Localized by Accept-Language."
        email:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        department:
          $ref: "./common.yaml#/components/schemas/DepartmentRefDto"
        jobTitle:
          type: string
        hireDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        currentShift:
          allOf:
            - $ref: "#/components/schemas/EmployeeShiftSummaryDto"
          nullable: true
    EmployeeTeamMemberPagedResultDto:
      type: object

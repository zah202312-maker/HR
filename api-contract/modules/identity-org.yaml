          $ref: "./common.yaml#/components/responses/Forbidden"
  /api/app/me/inbox-summary:
    get:
      operationId: Me_GetInboxSummary
      tags: [CurrentUser]
      summary: "Get counts for my pending actions"
      description: >-
        يعيد أعداد ما ينتظر إجراء المستخدم لكل فئة، لبطاقة «بانتظار إجرائي» والشارات. يشمل ما وصله عبر تفويض نشط. قائمة الطلبات نفسها في GET /api/app/request/inbox. لا يشمل الشكاوى إطلاقًا، لا عددًا ولا فئة، فمعالجوها يستخدمون صندوقها المستقل، حتى لا يكشف الملخص وجود شكوى أو مستواها. لا يحتوي أسماء أو تفاصيل.
      x-source: ["5.5", "5.8", "8"]
      x-release: 2
      x-allowed-roles: [employee, departmentManager, hrManager, executiveDirector, reviewer, accountant, storeOfficer, systemAdmin]
      x-permission: null
      x-data-scope: self
      x-error-codes: []
      x-added-route: "ملخص موحد لصندوق «بانتظار إجرائي» يجمع الفئات من كل الوحدات (القسم 5.5)."
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxSummaryDto"
              example:
                totalCount: 5
                items:
                  - category: request
                    count: 3
                    delegatedCount: 1
                  - category: memo
                    count: 1
                    delegatedCount: 0
                  - category: circularAcknowledgement
                    count: 1
                    delegatedCount: 0
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
  /api/app/me/administrative-task-log:
    get:
      operationId: Me_GetAdministrativeTaskLog
      tags: [CurrentUser]
      summary: "Get my administrative task log as a manager"
      description: >-
        سجل المهام الإدارية لمدير القسم ضمن ملفه: قرارات الطلبات، ما رفعه نيابة عن موظفيه، المطالعات والبلاغات، التقييم والتقرير، التعاميم، الجرد، توصيات الإنذار. لا يتضمن أي عمل على الشكاوى.
      x-source: ["5.1"]
      x-release: 2
      x-allowed-roles: [departmentManager]
      x-permission: Hr.Employee.ReadOwnTaskLog
      x-data-scope: self
      x-error-codes: []
      x-added-route: "سجل المهام الإدارية في ملف مدير القسم (القسم 5.1)."
      parameters:
        - $ref: "./common.yaml#/components/parameters/AcceptLanguage"
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: taskType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AdministrativeTaskType"
        - $ref: "./common.yaml#/components/parameters/SkipCount"
        - $ref: "./common.yaml#/components/parameters/MaxResultCount"
        - $ref: "./common.yaml#/components/parameters/Sorting"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministrativeTaskLogPagedResultDto"
              example:
                totalCount: 1
                items:
                  - occurredAt: "2026-10-28T07:45:00Z"
                    taskType: requestApproved

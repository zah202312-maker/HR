services:
  hr_mangment2-web:
    image: hr_mangment2-web:latest
    container_name: hr_mangment2-web
    build:
      context: ../../../
      dockerfile: angular/Dockerfile.local      
    ports:
      - "4200:80"
    depends_on:
      - hr_mangment2-api
    volumes:
      - ./dynamic-env.json://usr/share/nginx/html/dynamic-env.json
    networks:
      - abp-network  

  hr_mangment2-api:
    image: hr_mangment2-api:latest
    container_name: hr_mangment2-api-container
    build:
      context: ../../
      dockerfile: HR_Mangment2/Dockerfile.local
    environment:
      - ASPNETCORE_URLS=https://+:8081;http://+:8080;
      - Kestrel__Certificates__Default__Path=/app/certs/localhost.pfx
      - Kestrel__Certificates__Default__Password=${KESTREL_CERT_PASSWORD}
      - App__SelfUrl=https://localhost:44382
      - App__HealthCheckUrl=http://hr_mangment2:8080/health-status
      - AuthServer__Authority=http://hr_mangment2-api:8080
      - AuthServer__RequireHttpsMetadata=false
      - AuthServer__SetSelfAsIssuer=true 
      - ConnectionStrings__Default=User ID=postgres;Password=${POSTGRES_PASSWORD};Host=postgres;Port=5432;Database=HR_Mangment2;Pooling=false;
    ports:
      - "44382:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure    
    volumes:
      - ./certs:/app/certs
    networks:
      - abp-network  
  
  db-migrator:
    image: hr_mangment2-api:latest
    container_name: db-migrator
    build:
      context: ../../
      dockerfile: HR_Mangment2/Dockerfile.local
    environment:
      - ConnectionStrings__Default=User ID=postgres;Password=${POSTGRES_PASSWORD};Host=postgres;Port=5432;Database=HR_Mangment2;Pooling=false;
    command:
      - --migrate-database
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - abp-network
  postgres:
    container_name: postgres-db
    image: postgres:14.1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/opt/postgres
    networks:
      - abp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
    name: hr_mangment2_postgres_data
networks:
  abp-network:
    name: hr_mangment2-network
    driver: bridge